<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<title>YSFLIGHT web</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    outline: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0e14;
    color: #cfd8e3;
    font-family: system-ui, sans-serif;
    transition: opacity 0.4s;
    z-index: 10;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #overlay h1 {
    font-weight: 600;
    letter-spacing: 0.08em;
  }
  #progress {
    width: min(420px, 80vw);
    height: 8px;
    background: #1d2633;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 16px;
  }
  #progress > div {
    height: 100%;
    width: 0;
    background: #4da3ff;
    transition: width 0.2s;
  }
  #status {
    margin-top: 12px;
    font-size: 13px;
    color: #8fa3bb;
    min-height: 1.2em;
  }
  #note {
    margin-top: 28px;
    font-size: 12px;
    color: #5d7290;
    max-width: 480px;
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div id="overlay">
  <h1>YSFLIGHT web</h1>
  <div id="progress"><div id="bar"></div></div>
  <div id="status">loading...</div>
  <div id="note">
    YS FLIGHT SIMULATOR (c) Soji Yamakawa (CaptainYS) — WebAssembly port.<br>
    元データ・ソースコード: <a href="https://github.com/captainys/YSFLIGHT" style="color:#4da3ff">captainys/YSFLIGHT</a>
  </div>
</div>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  // Asset names; scripts/build.sh rewrites this line with content-hashed names.
  var ASSET = {js:'ysflight32_gl2.js',wasm:'ysflight32_gl2.wasm',data:'ysflight32_gl2.data',build:'dev'}; // __ASSET_LINE__

  var overlay = document.getElementById('overlay');
  var bar = document.getElementById('bar');
  var statusEl = document.getElementById('status');
  var booted = false;

  var Module = {
    canvas: document.getElementById('canvas'),
    // WebRTC multiplayer: signaling defaults to this site's own /signal endpoint
    // (a Cloudflare Worker + Durable Object; see worker/signal.js).  Game traffic
    // is peer-to-peer over WebRTC DataChannels with public STUN.
    //   ?signal=wss://host/path  overrides the signaling endpoint
    //   ?room=ABC123             fixes the host's room code
    ysfwSignalUrl: new URLSearchParams(location.search).get('signal') ||
      ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/signal'),
    ysfwRoomCode: new URLSearchParams(location.search).get('room') || undefined,
    locateFile: function (path) {
      if (path === 'ysflight32_gl2.wasm') return ASSET.wasm;
      if (path === 'ysflight32_gl2.data') return ASSET.data;
      return path;
    },
    // UI language follows the browser locale (ja/en); override with ?lang=ja etc.
    // ?freeflight=AIRPLANE,FIELD[,POSITION] jumps straight into a flight.
    // ?join=ROOMCODE[&name=NAME] auto-joins a multiplayer room over WebRTC.
    arguments: (function () {
      var a = [];
      var q = new URLSearchParams(location.search);
      var lang = q.get('lang');
      if (lang) a.push('-language', lang);
      var ff = q.get('freeflight');
      if (ff) {
        var p = ff.split(',');
        a.push('-freeflight', p[0], p[1] || 'ATSUGI_AIRBASE', p[2] || 'NORTH3000');
      }
      // ?join=ABC123 auto-joins that room as a network client.  The "#" prefix
      // routes the connection through the WebRTC DataChannel path (signaling via
      // this site's /signal); there is no host IP or port to enter.
      var join = q.get('join');
      if (join) {
        var nm = q.get('name') || ('Pilot' + Math.floor(1000 + Math.random() * 9000));
        a.push('-client', nm, '#' + join);
      }
      return a;
    })(),
    preRun: [function () {
      // Let YSFLIGHT's locale detection see the browser language.
      try {
        Module.ENV.LANG = (navigator.language || 'en').replace('-', '_') + '.UTF-8';
      } catch (e) {}
      // Persist user config (/home/web_user/Documents) in IndexedDB.
      var FS = Module.FS, IDBFS = Module.IDBFS;
      try { FS.mkdir('/home/web_user/Documents'); } catch (e) {}
      FS.mount(IDBFS, {}, '/home/web_user/Documents');
      Module.addRunDependency('idbfs-load');
      FS.syncfs(true, function () { Module.removeRunDependency('idbfs-load'); });
    }],
    setStatus: function (text) {
      if (booted) return;
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) {
        bar.style.width = (100 * parseFloat(m[2]) / parseFloat(m[4])) + '%';
        statusEl.textContent = m[1].trim();
      } else {
        statusEl.textContent = text || '';
      }
    },
    onRuntimeInitialized: function () {
      booted = true;
      overlay.classList.add('hidden');
      // Persist /home/web_user/Documents to IndexedDB.  Guard against
      // overlapping syncfs calls (interval + visibilitychange/beforeunload, or a
      // slow write): a second syncfs while one is in flight is wasted work and
      // triggers emscripten's "N FS.syncfs operations in flight" warning.
      var syncing = false;
      var flush = function () {
        if (syncing) return;
        syncing = true;
        try { Module.FS.syncfs(false, function () { syncing = false; }); }
        catch (e) { syncing = false; }
      };
      setInterval(flush, 10000);
      window.addEventListener('visibilitychange', flush);
      window.addEventListener('beforeunload', flush);
    },
    print: function (text) { console.log(text); },
    printErr: (function () {
      // YSFLIGHT's startup shader check prints a benign "Cannot find uniform
      // location ... Could be normal" triplet for uniforms that the GLSL
      // compiler optimized out.  Keep the console readable by default;
      // ?verbose=1 shows everything.
      var verbose = new URLSearchParams(location.search).get('verbose');
      var benign = /^(Called from YsGLSL|Cannot find uniform location|Could be normal since error check|warning: unsupported syscall: __syscall_setsockopt)/;
      return function (text) {
        if (!verbose && benign.test(text)) return;
        console.warn(text);
      };
    })()
  };

  window.addEventListener('error', function (e) {
    if (!booted) statusEl.textContent = 'Error: ' + e.message;
  });

  // PWA: cache the app for instant reload and offline play.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  // Multiplayer host helper: while hosting, the engine shows a "Room: #CODE"
  // overlay (#ysfw-room-overlay).  Offer a one-click copy of the invite link
  // https://<this-site>/?join=CODE so the host just sends a URL — opening it
  // auto-joins the room (see ?join= above).  No IP/port: the room code is all
  // a guest needs; signaling rides this site's /signal endpoint.
  (function () {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.style.cssText = 'position:fixed;top:46px;right:8px;z-index:31;display:none;' +
      'background:#1d2633;color:#cfd8e3;border:1px solid #33425a;border-radius:6px;' +
      'padding:6px 12px;font:13px system-ui,sans-serif;cursor:pointer';
    var idle = '📋 招待リンクをコピー'; // 📋 招待リンクをコピー
    btn.textContent = idle;
    var url = '';
    btn.addEventListener('click', function () {
      if (!url) return;
      var ok = function () {
        btn.textContent = '✓ コピーしました'; // ✓ コピーしました
        setTimeout(function () { btn.textContent = idle; }, 1500);
      };
      var fallback = function () {
        var ta = document.createElement('textarea');
        ta.value = url; ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); ok(); } catch (e) {}
        ta.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(ok, fallback);
      } else { fallback(); }
    });
    document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(btn); });
    if (document.body) document.body.appendChild(btn);
    // The engine rewrites the overlay's textContent ("Room: #X (connecting...)"
    // then "Room: #X"), so poll for the current room code rather than mutating it.
    setInterval(function () {
      var ov = document.getElementById('ysfw-room-overlay');
      var m = ov && ov.textContent && ov.textContent.match(/#([0-9A-Z]+)/);
      if (m) { url = location.origin + '/?join=' + m[1]; btn.title = url; btn.style.display = ''; }
      else { btn.style.display = 'none'; }
    }, 800);
  })();

  // Load the (possibly content-hashed) engine.
  (function () {
    var s = document.createElement('script');
    s.async = true;
    s.src = ASSET.js;
    document.body.appendChild(s);
  })();
</script>
</body>
</html>
