<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<script type="module" src="packs-ui.js"></script>
<script type="module" src="pack-net.js"></script>
<title>YSFLIGHT web</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    outline: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0a0e14;
    color: #cfd8e3;
    font-family: system-ui, sans-serif;
    transition: opacity 0.4s;
    z-index: 10;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #overlay h1 {
    font-weight: 600;
    letter-spacing: 0.08em;
  }
  #progress {
    width: min(420px, 80vw);
    height: 8px;
    background: #1d2633;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 16px;
  }
  #progress > div {
    height: 100%;
    width: 0;
    background: #4da3ff;
    transition: width 0.2s;
  }
  #status {
    margin-top: 12px;
    font-size: 13px;
    color: #8fa3bb;
    min-height: 1.2em;
  }
  #note {
    margin-top: 28px;
    font-size: 12px;
    color: #5d7290;
    max-width: 480px;
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div id="overlay">
  <h1>YSFLIGHT web</h1>
  <div id="progress"><div id="bar"></div></div>
  <div id="status">loading...</div>
  <div id="note">
    YS FLIGHT SIMULATOR (c) Soji Yamakawa (CaptainYS) — WebAssembly port.<br>
    <span id="note-src">元データ・ソースコード: </span><a href="https://github.com/captainys/YSFLIGHT" style="color:#4da3ff">captainys/YSFLIGHT</a>
  </div>
</div>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  // Asset names; scripts/build.sh rewrites this line with content-hashed names.
  var ASSET = {js:'ysflight32_gl2.js',wasm:'ysflight32_gl2.wasm',data:'ysflight32_gl2.data',build:'dev'}; // __ASSET_LINE__

  var overlay = document.getElementById('overlay');
  var bar = document.getElementById('bar');
  var statusEl = document.getElementById('status');
  var booted = false;

  // Shell UI locale.  Mirrors the engine's own ja/en selection (?lang, else the
  // browser locale): the wasm UI already localizes, this localizes the pre-boot
  // shell (loading note, connection badge, Room chip, join forms, pack panel).
  // Exposed on window so packs-ui.js shares the same choice.
  window.ysfwLang = (function () {
    var q = new URLSearchParams(location.search).get('lang');
    var l = String(q || navigator.language || 'en').toLowerCase();
    return l.indexOf('ja') === 0 ? 'ja' : 'en';
  })();
  var TXT = ({
    ja: {
      note: '元データ・ソースコード: ',
      chipCopyTitle: 'クリックで招待リンクをコピー',
      chipCopied: '✓ 招待リンクをコピーしました',
      connecting: '（接続中…）',
      badgeTitle: '対戦の接続性チェック（クリックで再確認）',
      badgeChecking: '接続を確認中…',
      badgeCheckingTitle: '対戦の接続性をチェックしています',
      badgeOffline: '🟠 接続を確認できません',
      badgeOfflineTitle: 'STUN サーバに到達できませんでした。ネットワーク／ファイアウォール、またはオフラインの可能性があります（TURN の TLS/443 経由なら繋がる場合もあります）。クリックで再確認。',
      badgeRelay: '🟡 TURN 中継で接続',
      badgeRelayTitle: 'この回線は通信タイプが厳しめ（対称NAT）で直結できないことがありますが、TURN リレー経由で接続できます。直結よりわずかに遅延が増えます。クリックで再確認。',
      badgeSymmetric: '🟡 一部の相手と繋がらないかも',
      badgeSymmetricTitle: 'この回線は通信タイプが厳しめ（対称NAT）です。TURN 中継が未設定のため、相手も同じタイプだと直接つながらないことがあります。クリックで再確認。',
      badgeDirect: '🟢 マルチプレイOK',
      badgeDirectTitle: 'この回線は対戦に適しています（多くの相手と直接つながります）。クリックで再確認。',
      joinLabel: 'Room ID で参加',
      joinNamePlaceholder: '名前（任意）',
      joinBtn: 'ルームに参加',
      errRoomEmpty: 'Room ID を入力してください',
      errRoomInvalid: 'Room ID は英数字・- ・_（14文字以内）で入力してください',
      inviteNameLabel: function (room) { return 'Room ' + room + ' に参加 — 名前を入力'; },
      inviteJoinBtn: '参加する',
      syncError: '(同期エラー)',
    },
    en: {
      note: 'Source & assets: ',
      chipCopyTitle: 'Click to copy the invite link',
      chipCopied: '✓ Invite link copied',
      connecting: ' (connecting…)',
      badgeTitle: 'Multiplayer connectivity check (click to re-check)',
      badgeChecking: 'Checking connection…',
      badgeCheckingTitle: 'Checking multiplayer connectivity',
      badgeOffline: '🟠 Can’t check connection',
      badgeOfflineTitle: 'Could not reach a STUN server — you may be offline or behind a firewall (TURN over TLS/443 may still connect). Click to re-check.',
      badgeRelay: '🟡 Connects via TURN relay',
      badgeRelayTitle: 'This network is restrictive (symmetric NAT) so direct P2P may fail, but you can still connect through the TURN relay. Slightly higher latency than a direct connection. Click to re-check.',
      badgeSymmetric: '🟡 Some peers may not connect',
      badgeSymmetricTitle: 'This network is restrictive (symmetric NAT). No TURN relay is configured, so peers on the same kind of network may not connect directly. Click to re-check.',
      badgeDirect: '🟢 Multiplayer OK',
      badgeDirectTitle: 'This network is good for multiplayer (direct connection to most peers). Click to re-check.',
      joinLabel: 'Join by Room ID',
      joinNamePlaceholder: 'Name (optional)',
      joinBtn: 'Join room',
      errRoomEmpty: 'Enter a Room ID',
      errRoomInvalid: 'Room ID: letters, digits, - and _ only (max 14 chars)',
      inviteNameLabel: function (room) { return 'Joining Room ' + room + ' — enter your name'; },
      inviteJoinBtn: 'Join',
      syncError: '(sync error)',
    },
  })[window.ysfwLang];
  document.documentElement.lang = window.ysfwLang;
  (function () { var n = document.getElementById('note-src'); if (n) n.textContent = TXT.note; })();

  var Module = {
    canvas: document.getElementById('canvas'),
    // WebRTC multiplayer: signaling defaults to this site's own /signal endpoint
    // (a Cloudflare Worker + Durable Object; see worker/signal.js).  Game traffic
    // is peer-to-peer over WebRTC DataChannels with public STUN.
    //   ?signal=wss://host/path  overrides the signaling endpoint
    //   ?room=12345678           fixes the host's room code (8-digit numeric)
    //   ?join=12345678           pre-fills the Room ID to join (invite links)
    ysfwSignalUrl: new URLSearchParams(location.search).get('signal') ||
      ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/signal'),
    ysfwRoomCode: new URLSearchParams(location.search).get('room') || undefined,
    ysfwJoinRoom: new URLSearchParams(location.search).get('join') || undefined,
    locateFile: function (path) {
      if (path === 'ysflight32_gl2.wasm') return ASSET.wasm;
      if (path === 'ysflight32_gl2.data') return ASSET.data;
      return path;
    },
    // UI language follows the browser locale (ja/en); override with ?lang=ja etc.
    // ?freeflight=AIRPLANE,FIELD[,POSITION] jumps straight into a flight.
    arguments: (function () {
      var a = [];
      var q = new URLSearchParams(location.search);
      var lang = q.get('lang');
      if (lang) a.push('-language', lang);
      var ff = q.get('freeflight');
      if (ff) {
        var p = ff.split(',');
        a.push('-freeflight', p[0], p[1] || 'ATSUGI_AIRBASE', p[2] || 'NORTH3000');
      }
      return a;
    })(),
    preRun: [function () {
      // Let YSFLIGHT's locale detection see the browser language.
      try {
        Module.ENV.LANG = (navigator.language || 'en').replace('-', '_') + '.UTF-8';
      } catch (e) {}
      // Persist user config (/home/web_user/Documents) in IndexedDB.
      var FS = Module.FS, IDBFS = Module.IDBFS;
      try { FS.mkdir('/home/web_user/Documents'); } catch (e) {}
      FS.mount(IDBFS, {}, '/home/web_user/Documents');
      Module.addRunDependency('idbfs-load');
      FS.syncfs(true, function () {
        // Pre-boot add-on pack management.  Hold a run dependency so the engine's
        // one-time template scan (a few frames into main) runs only after packs
        // are in place — no reload needed.  Three flows:
        //   manual launch -> hold the gate, show the pack panel, release on play
        //   ?join=<room>  -> hold the gate, sync the host's packs P2P, release (M6)
        //   ?freeflight   -> boot straight in (no host to sync from)
        var gateReleased = false;
        function releaseGate() {
          if (gateReleased) return;
          if (Module.__ysfwGateHeld) {
            Module.removeRunDependency('ysfw-packs');
            Module.__ysfwGateHeld = false;
          }
          gateReleased = true;
        }
        try {
          var q = new URLSearchParams(location.search);
          var joinRoom = Module.ysfwJoinRoom;
          var freeflight = q.get('freeflight');
          Module.__ysfwUserDir = '/home/web_user/Documents/YSFLIGHT.COM/YSFLIGHT';
          try { FS.mkdirTree(Module.__ysfwUserDir); } catch (e) {}
          if (joinRoom) {
            // M6/M7: hold the gate and OBTAIN the host's enabled packs before
            // main() — Option B (self-fetch each pack's advertised URL) with a
            // fallback to Option A (host P2P push).  A missing REQUIRED field is
            // fatal in the engine, so on failure we show an explicit panel
            // (Retry / play Solo) instead of booting silently into a broken join.
            Module.addRunDependency('ysfw-packs');
            Module.__ysfwGateHeld = true;
            Module.__ysfwJoinSync = true;
            window.__ysfwFsReady = true;
            if (window.ysfwPacksInit) window.ysfwPacksInit();
            // Solo = abandon the join: drop the -client args (set by the join IIFE
            // below) so the engine boots single-player rather than connecting to a
            // host whose required field we could not obtain, then release the gate.
            // Safe to mutate Module.arguments here: main() has not run (gate held).
            function bootSolo() {
              try {
                var ci = Module.arguments.indexOf('-client');
                if (ci >= 0) Module.arguments = Module.arguments.slice(0, ci);
              } catch (e) {}
              releaseGate();
            }
            // Re-runnable so the obtain-failure panel's "Retry" can try again (M7).
            function runJoinSync() {
              var doSync = (window.ysfwPackNet && window.ysfwPackNet.syncAsJoiner)
                ? window.ysfwPackNet.syncAsJoiner(joinRoom)
                : Promise.resolve(null);
              return doSync.then(function (r) {
                // If the gate already went (backstop fired, or the user chose Solo
                // on a prior attempt), a late-resolving sync must not pop a panel
                // over an already-booting engine.
                if (gateReleased) return;
                if (r) console.log('[pack-net join] pre-boot sync: ' + JSON.stringify(r));
                if (r && r.requiredFailed && r.requiredFailed.length &&
                    window.ysfwPacks && window.ysfwPacks.showJoinFailure) {
                  window.ysfwPacks.showJoinFailure(r.requiredFailed, { onRetry: runJoinSync, onSolo: bootSolo });
                  return;
                }
                releaseGate();
              }, function (e) {
                if (gateReleased) return;
                console.warn('[pack-net join] pre-boot sync failed: ' + (e && e.message ? e.message : e));
                // An unexpected error is still an obtain failure — surface the UX,
                // never hang the boot silently.
                if (window.ysfwPacks && window.ysfwPacks.showJoinFailure) {
                  window.ysfwPacks.showJoinFailure([{ id: '', name: TXT.syncError, categories: [] }], { onRetry: runJoinSync, onSolo: bootSolo });
                } else {
                  releaseGate();
                }
              });
            }
            // Absolute backstop: every sync leg has its own timeout, but if the
            // machinery somehow never resolves AND no decision panel is up, boot
            // SOLO rather than hang forever — never silently enter a -client join
            // whose pack sync never finished (when the panel is up, the user drives
            // it, so this stays a no-op then).
            setTimeout(function () {
              if (!gateReleased && !Module.__ysfwJoinFailureShown) bootSolo();
            }, 90000);
            runJoinSync();
          } else if (!freeflight) {
            // Manual launch: show the pack panel; packs-ui.js releases on "play".
            Module.addRunDependency('ysfw-packs');
            Module.__ysfwGateHeld = true;
            // Safety net: if packs-ui.js failed to load, never hang the boot.
            setTimeout(function () {
              if (Module.__ysfwGateHeld && !Module.__ysfwPanelShown) releaseGate();
            }, 5000);
            window.__ysfwFsReady = true;
            if (window.ysfwPacksInit) window.ysfwPacksInit();
          } else {
            // freeflight: boot straight in.
            window.__ysfwFsReady = true;
            if (window.ysfwPacksInit) window.ysfwPacksInit();
          }
        } catch (e) {
          releaseGate();
        }
        // Release idbfs-load LAST so the run-dependency count never transiently
        // hits 0 above — otherwise a cached/instant .data preload lets Emscripten
        // schedule run()/callMain before the gate is added, aborting with
        // "cannot call main when async dependencies remain".
        Module.removeRunDependency('idbfs-load');
      });
    }],
    setStatus: function (text) {
      if (booted) return;
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) {
        bar.style.width = (100 * parseFloat(m[2]) / parseFloat(m[4])) + '%';
        statusEl.textContent = m[1].trim();
      } else {
        statusEl.textContent = text || '';
      }
    },
    onRuntimeInitialized: function () {
      booted = true;
      overlay.classList.add('hidden');
      // Persist /home/web_user/Documents to IndexedDB.  Guard against
      // overlapping syncfs calls (interval + visibilitychange/beforeunload, or a
      // slow write): a second syncfs while one is in flight is wasted work and
      // triggers emscripten's "N FS.syncfs operations in flight" warning.
      var syncing = false;
      var flush = function () {
        if (syncing) return;
        syncing = true;
        try { Module.FS.syncfs(false, function () { syncing = false; }); }
        catch (e) { syncing = false; }
      };
      setInterval(flush, 10000);
      window.addEventListener('visibilitychange', flush);
      window.addEventListener('beforeunload', flush);
    },
    print: function (text) { console.log(text); },
    printErr: (function () {
      // YSFLIGHT's startup shader check prints a benign "Cannot find uniform
      // location ... Could be normal" triplet for uniforms that the GLSL
      // compiler optimized out.  Keep the console readable by default;
      // ?verbose=1 shows everything.
      var verbose = new URLSearchParams(location.search).get('verbose');
      var benign = /^(Called from YsGLSL|Cannot find uniform location|Could be normal since error check|warning: unsupported syscall: __syscall_setsockopt)/;
      return function (text) {
        if (!verbose && benign.test(text)) return;
        console.warn(text);
      };
    })()
  };

  // TURN: fetch short-lived ICE servers (Cloudflare Realtime TURN, minted by the
  // Worker's /turn endpoint) so peers behind symmetric NAT / CGNAT can relay when
  // direct P2P fails — otherwise a cross-machine joiner never receives the host's
  // game state and the aircraft list is empty.  Fired at load so the creds are
  // ready before the user hosts/joins.  The engine game channel reads
  // Module.ysfwIceServers (yssocket) and the pack channel reads window.ysfwPackIce
  // (pack-net.js); both fall back to public STUN if /turn is unconfigured (204) or
  // unreachable.  ?turn=0 forces STUN-only (to reproduce the no-TURN behaviour).
  (function () {
    if (new URLSearchParams(location.search).get('turn') === '0') return;
    try {
      fetch('/turn', { method: 'POST' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (d && Array.isArray(d.iceServers) && d.iceServers.length) {
            Module.ysfwIceServers = d.iceServers;
            window.ysfwPackIce = d.iceServers;
            console.log('[turn] ICE relay ready (' + d.iceServers.length + ' server group(s))');
          }
        })
        .catch(function () { /* STUN-only fallback */ });
    } catch (e) {}
  })();

  window.addEventListener('error', function (e) {
    if (!booted) statusEl.textContent = 'Error: ' + e.message;
  });

  // PWA: cache the app for instant reload and offline play.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  function loadEngine() {
    var s = document.createElement('script');
    s.async = true;
    s.src = ASSET.js;
    document.body.appendChild(s);
  }

  // ---- On-screen multiplayer UI: connection badge + invite link ------------
  // Three states, driven by globalThis.ysfwInFlight (set by the engine's
  // ChangeRunMode) and globalThis.ysfwRtc.host (set while this browser hosts):
  //   - menu (not flying)        -> connection badge only
  //   - hosting a server         -> clickable Room ID chip (click = copy invite)
  //   - flying as client / solo  -> nothing
  (function () {
    // Room ID chip (shown only while hosting): the Room ID itself is the copy
    // control — hover shows a pointer cursor, a 📋 icon hints it is clickable,
    // and clicking copies the invite link /?join=<room>.  It replaces (and
    // hides) the engine's #ysfw-room-overlay.
    var chip = null;
    function ensureChip() {
      if (chip) return chip;
      chip = document.createElement('div');
      chip.id = 'ysfw-room-chip';
      chip.style.cssText = 'position:fixed;top:8px;right:8px;z-index:31;background:rgba(10,14,20,.85);color:#cfd8e3;padding:8px 14px;border-radius:6px;font:14px monospace;cursor:pointer;user-select:none;display:none';
      chip.title = TXT.chipCopyTitle;
      chip.onclick = function () {
        var R = globalThis.ysfwRtc;
        var code = (R && R.host && R.host.room) || Module.ysfwRoomCode;
        if (!code) return;
        var url = location.origin + '/?join=' + code;
        var done = function () {
          chip._copied = true;
          chip.textContent = TXT.chipCopied;
          setTimeout(function () { chip._copied = false; }, 1600);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, done);
        } else {
          var ta = document.createElement('textarea');
          ta.value = url; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          ta.remove(); done();
        }
      };
      document.body.appendChild(chip);
      return chip;
    }
    function renderChip(code, connecting) {
      var c = ensureChip();
      if (c._copied) return;  // keep the "copied" confirmation visible briefly
      c.textContent = 'Room: ' + code + (connecting ? TXT.connecting + '📋' : '  📋');
    }

    // Connection badge: a one-shot STUN probe hinting whether direct P2P is
    // likely.  Same mapped port from two STUN servers => cone NAT (P2P OK);
    // different ports => symmetric NAT (a TURN relay would be needed).
    var badge = null, checkState = 'idle';
    function ensureBadge() {
      if (badge) return badge;
      badge = document.createElement('button');
      badge.id = 'ysfw-conn-badge';
      // Menu-only (invite button is hidden then), so it takes the top slot.
      badge.style.cssText = 'position:fixed;right:8px;top:8px;z-index:20;font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid #2a3647;background:#0d141d;color:#cfd8e3;cursor:pointer;display:none';
      badge.title = TXT.badgeTitle;
      badge.onclick = function () { if (checkState !== 'running') runCheck(); };
      document.body.appendChild(badge);
      return badge;
    }
    function setBadge(text, title) {
      var b = ensureBadge();
      b.textContent = text;
      if (title) b.title = title;
    }

    function srflxPort(iceServer, timeoutMs) {
      return new Promise(function (resolve) {
        var pc, done = false;
        var finish = function (p) { if (!done) { done = true; try { pc.close(); } catch (e) {} resolve(p); } };
        try { pc = new RTCPeerConnection({ iceServers: [{ urls: iceServer }] }); }
        catch (e) { return resolve(null); }
        try { pc.createDataChannel('probe'); } catch (e) {}
        pc.onicecandidate = function (e) {
          if (!e.candidate) return finish(null);
          var parts = (e.candidate.candidate || '').split(' ');
          if (parts[7] === 'srflx') finish(parts[5]); // server-reflexive mapped port
        };
        pc.createOffer().then(function (o) { return pc.setLocalDescription(o); }).catch(function () { finish(null); });
        setTimeout(function () { finish(null); }, timeoutMs || 4000);
      });
    }
    // Is a TURN relay actually available?  The /turn fetch (top of this file)
    // populates Module.ysfwIceServers / window.ysfwPackIce with the Cloudflare
    // iceServers; a turn: URL there means even a symmetric-NAT line can relay.
    function turnAvailable() {
      var ice = (window.Module && window.Module.ysfwIceServers) || window.ysfwPackIce;
      return Array.isArray(ice) && JSON.stringify(ice).indexOf('turn:') !== -1;
    }
    function runCheck() {
      checkState = 'running';
      setBadge(TXT.badgeChecking, TXT.badgeCheckingTitle);
      Promise.all([
        srflxPort('stun:stun.l.google.com:19302'),
        srflxPort('stun:stun1.l.google.com:19302')
      ]).then(function (ports) {
        checkState = 'done';
        if (!ports[0] && !ports[1]) {
          setBadge(TXT.badgeOffline, TXT.badgeOfflineTitle);
        } else if (ports[0] && ports[1] && ports[0] !== ports[1]) {
          // Symmetric NAT: with TURN configured the relay carries it (informational);
          // without TURN it is the old "may not connect to some peers" warning.
          if (turnAvailable()) setBadge(TXT.badgeRelay, TXT.badgeRelayTitle);
          else setBadge(TXT.badgeSymmetric, TXT.badgeSymmetricTitle);
        } else {
          setBadge(TXT.badgeDirect, TXT.badgeDirectTitle);
        }
      });
    }

    setInterval(function () {
      if (!booted) return;
      var roomEl = document.getElementById('ysfw-room-overlay');
      var R = globalThis.ysfwRtc;
      var inFlight = !!globalThis.ysfwInFlight;
      var host = R && R.host;
      if (!inFlight) {
        // MENU: connection badge only.
        ensureBadge().style.display = 'block';
        if (checkState === 'idle') runCheck();
        if (chip) chip.style.display = 'none';
        if (roomEl) roomEl.style.display = 'none';
      } else if (host && !host.failed) {
        // HOSTING: clickable Room ID chip (click to copy invite link); no badge.
        // The chip replaces the engine overlay, so hide #ysfw-room-overlay.
        if (badge) badge.style.display = 'none';
        if (roomEl) roomEl.style.display = 'none';
        renderChip(host.room, !host.ok);
        ensureChip().style.display = 'block';
      } else if (host && host.failed) {
        // Host setup failed: show the engine overlay's specific error message.
        if (badge) badge.style.display = 'none';
        if (chip) chip.style.display = 'none';
        if (roomEl) roomEl.style.display = '';
      } else {
        // FLYING as client/solo: hide everything.
        if (badge) badge.style.display = 'none';
        if (chip) chip.style.display = 'none';
        if (roomEl) roomEl.style.display = 'none';
      }
    }, 800);
  })();

  // Fullscreen via keyboard only (no on-screen control): F11 and Ctrl+Cmd+F
  // toggle the documentElement in/out of fullscreen.  We fullscreen the
  // documentElement (not just the canvas) so the overlay, Room chip and badge
  // stay visible inside fullscreen.  The listener is on the CAPTURE phase so it
  // beats the engine's SDL key handler; we only swallow these two combos and
  // pass every other key through, so gameplay keys are untouched.  F11 has no
  // default engine action and Ctrl+Cmd+F is not an engine binding, so claiming
  // them here is safe.  Browsers grant fullscreen only from a user gesture — a
  // keydown qualifies; preventDefault on F11 suppresses the browser's own native
  // fullscreen so we don't double-toggle.  Where the Fullscreen API is
  // unavailable (e.g. iOS Safari) the keys simply do nothing.
  (function () {
    var docEl = document.documentElement;
    var req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
    var exit = document.exitFullscreen || document.webkitExitFullscreen;
    function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement; }
    if (!req || !exit) return;  // API unsupported -> keys are no-ops
    function toggle() {
      try {
        if (fsElement()) exit.call(document);
        else req.call(docEl);
      } catch (e) {}
    }
    window.addEventListener('keydown', function (e) {
      var isF11 = e.key === 'F11' || e.keyCode === 122;
      var isCmdCtrlF = (e.key === 'f' || e.key === 'F' || e.keyCode === 70) && e.ctrlKey && e.metaKey;
      if (!isF11 && !isCmdCtrlF) return;
      e.preventDefault();
      e.stopImmediatePropagation();  // keep the engine's key handler from also seeing it
      toggle();
    }, true);
  })();

  // Host-side pack advertising (M6): once this browser is hosting a game, start
  // the shell-owned pack host on the derived pack-room so joiners can pull the
  // host's enabled packs P2P before they boot.  Keyed on globalThis.ysfwRtc.host
  // (set by the engine while hosting); independent of the engine's game peer
  // connection.  startPackHost publishes the manifest with its room claim.
  (function () {
    var startedRoom = null, handle = null;
    setInterval(function () {
      var R = globalThis.ysfwRtc;
      var room = (R && R.host && !R.host.failed) ? R.host.room : null;
      if (room && startedRoom !== room) {
        try {
          if (handle && handle.stop) handle.stop();
          handle = (window.ysfwPackNet && window.ysfwPackNet.host) ? window.ysfwPackNet.host(room) : null;
          startedRoom = room;
        } catch (e) { console.warn('[pack-net host] start failed: ' + e); }
      } else if (!room && startedRoom) {
        try { if (handle && handle.stop) handle.stop(); } catch (e) {}
        handle = null; startedRoom = null;
      }
    }, 800);
  })();

  // Invite join flow: ?join=<id> asks for a player name (unless ?name= is set),
  // then auto-joins Room <id> over WebRTC as a client.
  (function () {
    var q = new URLSearchParams(location.search);
    var joinRoom = q.get('join');
    var presetName = q.get('name');
    var freeflight = q.get('freeflight');

    function startJoin(name) {
      var nm = (name && name.trim()) || ('Pilot' + Math.floor(1000 + Math.random() * 9000));
      Module.arguments = Module.arguments.concat(['-client', nm, joinRoom]);
      loadEngine();
    }

    // Manual launch: let the user JOIN by typing a Room ID (no invite link).
    // Submitting just navigates to /?join=<room>(&name=<name>), so the whole
    // tested invite-link path runs verbatim — pre-boot pack sync holds the boot
    // gate (preRun reads ysfwJoinRoom from the URL) and the engine boots -client.
    // Reusing that path means no new join/gate logic and no preRun ordering hazard.
    function renderManualJoinForm() {
      if (document.getElementById('ysfw-manual-join')) return;
      var wrap = document.createElement('div');
      wrap.id = 'ysfw-manual-join';
      wrap.style.cssText = 'margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:8px';
      var label = document.createElement('div');
      label.style.cssText = 'font-size:14px;color:#cfd8e3';
      label.textContent = TXT.joinLabel;
      var inputCss = 'font-size:15px;padding:8px 10px;border-radius:6px;border:1px solid #2a3647;background:#0d141d;color:#e6edf3;width:min(260px,70vw);text-align:center';
      var roomIn = document.createElement('input');
      roomIn.type = 'text';
      roomIn.inputMode = 'numeric';
      roomIn.maxLength = 14;
      roomIn.placeholder = 'Room ID';
      roomIn.style.cssText = inputCss;
      var nameIn = document.createElement('input');
      nameIn.type = 'text';
      nameIn.maxLength = 200;
      nameIn.placeholder = TXT.joinNamePlaceholder;
      nameIn.style.cssText = inputCss;
      var err = document.createElement('div');
      err.style.cssText = 'font-size:12px;color:#c75d6a;min-height:1em';
      var btn = document.createElement('button');
      btn.textContent = TXT.joinBtn;
      btn.style.cssText = 'font-size:15px;padding:8px 22px;border-radius:6px;border:0;background:#4da3ff;color:#04101f;cursor:pointer;font-weight:600';
      var go = function () {
        var room = (roomIn.value || '').trim();
        if (!room) { err.textContent = TXT.errRoomEmpty; return; }
        // Keep within the signaling room-key limit (<=16) AND the derived pack
        // room's base budget (base + "~p" <= 16, so base <= 14): see
        // pack-net.js derivePackRoom and worker/signal.js.  Restrict the charset
        // so a pasted invite URL or stray "~" can't desync the derived pack room.
        if (!/^[A-Za-z0-9_-]{1,14}$/.test(room)) { err.textContent = TXT.errRoomInvalid; return; }
        var name = (nameIn.value || '').trim();
        location.href = location.origin + '/?join=' + encodeURIComponent(room) +
          (name ? '&name=' + encodeURIComponent(name) : '');
      };
      btn.addEventListener('click', go);
      roomIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
      nameIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
      wrap.appendChild(label);
      wrap.appendChild(roomIn);
      wrap.appendChild(nameIn);
      wrap.appendChild(err);
      wrap.appendChild(btn);
      overlay.appendChild(wrap);
    }

    if (joinRoom && !presetName) {
      statusEl.textContent = '';
      var form = document.createElement('div');
      form.style.cssText = 'margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px';
      var label = document.createElement('div');
      label.style.cssText = 'font-size:14px;color:#cfd8e3';
      label.textContent = TXT.inviteNameLabel(joinRoom);
      var input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 200;
      input.placeholder = 'Pilot';
      input.style.cssText = 'font-size:15px;padding:8px 10px;border-radius:6px;border:1px solid #2a3647;background:#0d141d;color:#e6edf3;width:min(260px,70vw);text-align:center';
      var goBtn = document.createElement('button');
      goBtn.textContent = TXT.inviteJoinBtn;
      goBtn.style.cssText = 'font-size:15px;padding:8px 22px;border-radius:6px;border:0;background:#4da3ff;color:#04101f;cursor:pointer;font-weight:600';
      var go = function () { form.remove(); statusEl.textContent = 'loading...'; startJoin(input.value); };
      goBtn.addEventListener('click', go);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
      form.appendChild(label); form.appendChild(input); form.appendChild(goBtn);
      overlay.appendChild(form);
      setTimeout(function () { input.focus(); }, 50);
    } else {
      if (joinRoom && presetName) {
        Module.arguments = Module.arguments.concat(['-client', presetName, joinRoom]);
      } else if (!freeflight) {
        // No invite link and not a freeflight deep-link: a deliberate manual
        // launch.  Offer "join by Room ID" next to the pack panel; the engine
        // still loads (for solo / hosting), but submitting the form navigates
        // away to the invite-link join flow before main() matters.
        renderManualJoinForm();
      }
      loadEngine();
    }
  })();
</script>
</body>
</html>
