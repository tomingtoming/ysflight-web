<title>YSFLIGHT web</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    outline: none;
  }
  /* ==== XP (Luna) tone & manner ============================================
     The shell dresses as a 2002-era desktop app (the era YSFLIGHT is from):
     Luna-blue titlebar, dialog face #ECE9D8, groupbox captions #0046D5,
     ListView selection #316AC5, XP-green progress, statusbar with a grip.
     Era idioms quoted on purpose: "(letter)" access-key captions, a "..."
     suffix meaning "opens another page", the DEFAULT (bold-ringed) button as
     the primary action.  No emoji as icons — text buttons, like the era. */
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* `safe` so that when the content is taller than the viewport it falls back
       to top-alignment and the overflow stays scrollable instead of being
       clipped off the top of a centered flex container. */
    justify-content: safe center;
    overflow-y: auto;
    padding: 22px 8px 30px;
    box-sizing: border-box;
    background: linear-gradient(180deg, #7FB2F0 0%, #4E86DD 45%, #2E64C8 100%);
    color: #000;
    font-family: Tahoma, 'MS UI Gothic', 'Yu Gothic UI', 'Hiragino Kaku Gothic ProN', system-ui, sans-serif;
    font-size: 13px;
    transition: opacity 0.4s;
    z-index: 10;
  }
  /* Bliss nod: a green hill on the horizon.  Viewport-fixed so it stays put
     while the overlay scrolls; painted before (= under) the window children. */
  #overlay::before {
    content: "";
    position: fixed;
    left: -20%;
    right: -20%;
    bottom: -14vh;
    height: 36vh;
    background: radial-gradient(ellipse at 50% 100%, #55B03C 0%, #3F9C35 45%, transparent 72%);
    pointer-events: none;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  /* Stop the indeterminate shimmers once boot hides the overlay.  The ?join /
     ?freeflight / ?replay paths only add .hidden (opacity:0) without display:none, and
     browsers keep compositing animations on opacity:0 elements — so without this the
     sheen would run forever behind the live game. */
  #overlay.hidden #progress::after,
  #overlay.hidden #ysfw-skeleton .sk-card::after { animation: none; }

  /* ---- the window ---- */
  .xp-win {
    width: min(760px, 100%);
    flex: none;
    border-radius: 8px 8px 4px 4px;
    background: #ECE9D8;
    box-shadow: 0 0 0 1px #0831D9, 4px 7px 22px rgba(0, 20, 60, 0.5);
    overflow: hidden;
    position: relative;
  }
  .xp-titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 6px 6px 10px;
    background: linear-gradient(180deg, #2B76E5 0%, #215DCF 6%, #3D8FFF 42%, #245EDC 88%, #1B54B0 100%);
    color: #fff;
    font-weight: 700;
    font-size: 13.5px;
    font-family: 'Trebuchet MS', Tahoma, sans-serif;
    text-shadow: 1px 1px 1px rgba(10, 30, 90, 0.75);
  }
  .xp-titlebar svg { width: 17px; height: 17px; flex: none; }
  .xp-titlebar .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xp-cap {
    width: 22px; height: 21px; flex: none; border-radius: 3px;
    border: 1px solid rgba(255,255,255,.75);
    font-size: 12px; line-height: 19px; text-align: center; color: #fff; font-family: Tahoma, monospace;
    background: linear-gradient(180deg, #7BA5EC, #3E6FD3 45%, #2E5BC0);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
  }
  .xp-cap.close { background: linear-gradient(180deg, #F0A088, #DD6547 40%, #C33B1E); }
  .xp-body { padding: 12px 12px 8px; }
  .xp-statusbar {
    display: flex; gap: 3px; padding: 4px;
    background: #ECE9D8; border-top: 1px solid #fff;
    box-shadow: inset 0 1px 0 #D8D4C4; position: relative;
  }
  .xp-cell {
    font-size: 11px; color: #444; padding: 3px 8px; white-space: nowrap;
    border: 1px solid; border-color: #ACA899 #fff #fff #ACA899; border-radius: 1px;
    overflow: hidden; text-overflow: ellipsis; min-height: 1.2em;
  }
  .xp-cell.grow { flex: 1; }
  .xp-grip {
    position: absolute; right: 3px; bottom: 3px; width: 13px; height: 13px;
    background:
      radial-gradient(circle at 10px 10px, #999 1.2px, transparent 1.6px),
      radial-gradient(circle at 6px 10px, #999 1.2px, transparent 1.6px),
      radial-gradient(circle at 10px 6px, #999 1.2px, transparent 1.6px),
      radial-gradient(circle at 2px 10px, #999 1.2px, transparent 1.6px),
      radial-gradient(circle at 6px 6px, #999 1.2px, transparent 1.6px),
      radial-gradient(circle at 10px 2px, #999 1.2px, transparent 1.6px);
  }

  /* ---- download row (status + progress) ---- */
  .xp-dl { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  #status { flex: none; font-size: 12px; color: #333; min-height: 1.2em; }
  #progress {
    position: relative;
    flex: 1;
    height: 17px;
    background: #fff;
    border: 1px solid #686868;
    border-radius: 3px;
    box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.2);
    padding: 2px;
    overflow: hidden;
    box-sizing: border-box;
  }
  #progress > div {
    height: 100%;
    width: 0;
    border-radius: 1px;
    background: linear-gradient(180deg, #8DF13C 0%, #4FD62E 45%, #2FB821 100%);
    transition: width 0.2s;
  }
  /* XP block segmentation over the green fill */
  #progress::before {
    content: "";
    position: absolute;
    inset: 2px;
    background: repeating-linear-gradient(90deg, transparent 0 12px, #fff 12px 14px);
    pointer-events: none;
    z-index: 1;
  }
  /* Indeterminate sheen over the track so a slow link — or the post-download wasm
     compile phase, where the numeric width can't advance — never looks frozen. */
  #progress::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.6) 50%, transparent 80%);
    transform: translateX(-100%);
    animation: ysfw-shimmer 1.4s ease-in-out infinite;
  }
  /* Loading skeleton: a non-interactive preview of the panel, painted immediately
     during the (~25MB) .data download so the wait shows its destination instead of
     a bare bar.  Removed by renderPanel() at manual launch, or hidden with the
     overlay at boot (?join / ?freeflight). */
  #ysfw-skeleton {
    margin-top: 2px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-sizing: border-box;
  }
  #ysfw-skeleton .sk-row { display: flex; gap: 8px; }
  #ysfw-skeleton .sk-card {
    flex: 1;
    height: 40px;
    border-radius: 3px;
    background: #F2F1E5;
    border: 1px solid #D0D0BF;
    position: relative;
    overflow: hidden;
  }
  #ysfw-skeleton .sk-hero { height: 52px; border-color: #ACA899; }
  #ysfw-skeleton .sk-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(100deg, transparent 20%, rgba(49,106,197,0.10) 50%, transparent 80%);
    transform: translateX(-100%);
    animation: ysfw-shimmer 1.6s ease-in-out infinite;
  }
  @keyframes ysfw-shimmer { to { transform: translateX(100%); } }
  /* Respect users who asked for less motion: drop the shimmer + opacity/width fades. */
  @media (prefers-reduced-motion: reduce) {
    #progress::after, #ysfw-skeleton .sk-card::after { animation: none; }
    #overlay, #progress > div { transition: none; }
  }
  /* Touch targets: the bottom-right shell row (Room chip, ? Help, fullscreen,
     connection badge) uses compact 12px buttons; lift them to the 44px minimum on
     coarse pointers so a thumb can hit them (esp. the Room chip = invite-link copy). */
  @media (pointer: coarse) {
    #ysfw-br-stack > * { min-height: 44px; min-width: 44px; box-sizing: border-box; }
  }

  /* ---- widgets (used by index.html forms and packs-ui.js) ---- */
  #overlay fieldset {
    border: 1px solid #D0D0BF;
    border-radius: 5px;
    padding: 10px 10px 12px;
    margin: 0 0 12px;
    background: #F2F1E5;
    min-width: 0;
  }
  #overlay legend { padding: 0 6px; font-size: 13px; color: #0046D5; }
  .xp-btn {
    display: inline-block;
    color: #000;
    text-decoration: none;
    text-align: center;
    border: 1px solid #003C74;
    border-radius: 3.5px;
    background: linear-gradient(180deg, #FFFFFF 0%, #F4F2E7 55%, #E5E1CE 90%, #D8D0B8 100%);
    box-shadow: inset 0 -2px 2px rgba(160, 140, 90, 0.22);
    padding: 7px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    min-height: 32px;
    box-sizing: border-box;
  }
  .xp-btn:hover { box-shadow: inset 0 0 0 2px rgba(248, 179, 53, 0.65), inset 0 -2px 2px rgba(160, 140, 90, 0.18); }
  .xp-btn:active { background: linear-gradient(180deg, #E5E1CE, #F4F2E7); }
  .xp-btn.default { box-shadow: inset 0 0 0 2px rgba(70, 120, 210, 0.55), inset 0 -2px 2px rgba(160, 140, 90, 0.18); font-weight: 700; }
  .xp-btn.default:hover { box-shadow: inset 0 0 0 2px rgba(248, 179, 53, 0.65), inset 0 -2px 2px rgba(160, 140, 90, 0.18); }
  .xp-btn.tile { text-align: left; padding: 8px 10px; }
  .xp-btn.tile b { display: block; font-size: 13px; }
  .xp-btn.tile span { display: block; font-size: 11px; color: #555; margin-top: 2px; font-weight: 400; }
  .xp-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
  .xp-rowline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .xp-note { font-size: 11px; color: #555; line-height: 1.5; }
  .xp-list { background: #fff; border: 1px solid #ACA899; border-radius: 2px; margin-bottom: 8px; }
  .xp-list .hd, .xp-list .row { display: grid; grid-template-columns: 1.1fr 1.4fr 0.55fr; gap: 8px; padding: 5px 8px; }
  .xp-list .hd {
    background: linear-gradient(180deg, #FFFFFF, #F0EEE1 70%, #E3E0CE);
    border-bottom: 1px solid #ACA899;
    font-size: 11px;
    color: #333;
  }
  .xp-list .row {
    font-size: 12.5px;
    cursor: pointer;
    border: 0;
    width: 100%;
    text-align: left;
    background: transparent;
    font-family: inherit;
    color: #000;
  }
  .xp-list .row:hover { background: #F3F7FD; }
  .xp-list .row.sel { background: #316AC5; color: #fff; }
  .xp-list .c2 { color: #555; } .xp-list .sel .c2 { color: #d7e2f6; }
  .xp-list .c3 { color: #777; font-size: 11px; } .xp-list .sel .c3 { color: #d7e2f6; }
  .xp-desc {
    background: #FFFFE1;
    border: 1px solid #ACA899;
    border-radius: 2px;
    padding: 6px 8px;
    font-size: 11.5px;
    color: #333;
    margin-bottom: 8px;
    min-height: 30px;
    box-sizing: border-box;
  }
  .xp-input {
    font-size: 13px;
    padding: 6px 8px;
    border: 1px solid #7F9DB9;
    border-radius: 2px;
    background: #fff;
    color: #000;
    font-family: inherit;
    box-sizing: border-box;
  }
  .xp-link {
    background: none;
    border: 0;
    color: #0046D5;
    font-size: 12.5px;
    cursor: pointer;
    padding: 4px;
    text-decoration: underline;
    font-family: inherit;
  }
  @media (max-width: 640px) {
    .xp-tiles { grid-template-columns: 1fr 1fr; }
    .xp-list .hd, .xp-list .row { grid-template-columns: 1fr 0.5fr; }
    .xp-list .hd .c2, .xp-list .row .c2 { display: none; }
  }

  /* status/pitch text that predates the window frame: the titlebar carries the
     tagline and the statusbar the load hint, so both stay in the DOM (they are
     aria-live / referenced) but hidden. */
  #pitch, #loadhint { display: none; }
  #note {
    margin-top: 10px;
    font-size: 10.5px;
    color: #EAF2FF;
    max-width: 640px;
    text-align: center;
    line-height: 1.6;
    text-shadow: 0 1px 2px rgba(0, 20, 60, 0.55);
    position: relative;
  }
</style>
</head>
<body>
<div id="overlay">
  <div class="xp-win">
    <div class="xp-titlebar">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1l1.2 5.2L15 8l-5.8 1.8L8 15l-1.2-5.2L1 8l5.8-1.8z" fill="#fff"/></svg>
      <span class="t"><span>YSFLIGHT web</span><span id="ysfw-tagline"></span></span>
      <span class="xp-cap" aria-hidden="true">_</span><span class="xp-cap" aria-hidden="true">□</span><span class="xp-cap close" aria-hidden="true">×</span>
    </div>
    <div class="xp-body" id="ysfw-win-body">
      <div class="xp-dl">
        <div id="status" role="status" aria-live="polite">loading...</div>
        <div id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="loading"><div id="bar"></div></div>
      </div>
      <div id="pitch"></div>
      <div id="loadhint"></div>

    </div>

      <span class="xp-cell grow" id="ysfw-sb-ready"></span>
      <span class="xp-cell" id="ysfw-sb-hint"></span>
      <span class="xp-cell" id="ysfw-sb-build"></span>
      <span class="xp-grip" aria-hidden="true"></span>
    </div>
  </div>
  <div id="note">
    YS FLIGHT SIMULATOR (c) Soji Yamakawa (CaptainYS) — an unofficial, fan-made WebAssembly port.<br>
    <span id="note-src">元データ・ソースコード: </span><a href="https://github.com/captainys/YSFLIGHT" style="color:#fff;font-weight:700">captainys/YSFLIGHT</a>
  </div>
</div>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  // Asset names; scripts/build.sh rewrites this line with content-hashed names.
  var ASSET = {js:'ysflight32_gl2.js',wasm:'ysflight32_gl2.wasm',data:'ysflight32_gl2.data',build:'dev'}; // __ASSET_LINE__

  var overlay = document.getElementById('overlay');
  var bar = document.getElementById('bar');
  var progressEl = document.getElementById('progress');
  var statusEl = document.getElementById('status');
  var booted = false;

  // Shell UI locale.  Mirrors the engine's own ja/en selection (?lang, else the

  // Exposed on window so packs-ui.js shares the same choice.
  window.ysfwLang = (function () {
    var q = new URLSearchParams(location.search).get('lang');
    var l = String(q || navigator.language || 'en').toLowerCase();
    return l.indexOf('ja') === 0 ? 'ja' : 'en';
  })();

    ja: {

      badgeTitle: '対戦の接続性チェック（クリックで再確認）',
      badgeChecking: '接続を確認中…',
      badgeCheckingTitle: '対戦の接続性をチェックしています',
      badgeOffline: '🟠 接続を確認できません',
      badgeOfflineTitle: 'STUN サーバに到達できませんでした。ネットワーク／ファイアウォール、またはオフラインの可能性があります（TURN の TLS/443 経由なら繋がる場合もあります）。クリックで再確認。',
      badgeRelay: '🟡 TURN 中継で接続',

      joinLabel: 'Room ID で参加',
      joinToggle: 'Room ID で参加(I)...',
      joinNamePlaceholder: '名前（任意）',
      joinBtn: 'ルームに参加',
      errRoomEmpty: 'Room ID を入力してください',
      errRoomInvalid: 'Room ID は英数字・- ・_（14文字以内）で入力してください',
      inviteNameLabel: function (room) { return 'Room ' + room + ' に参加 — 名前（任意）'; },
      inviteJoinBtn: '参加する',
      syncError: '(同期エラー)',
      joinSyncing: 'ホストのパックを同期中…',

      materializing: function (d, t) { return 'アドオンを展開中… ' + d + '/' + t; },

        Module.removeRunDependency('idbfs-load');
      });
    }],
    setStatus: function (text) {
      if (booted) return;
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) {
        var pct = 100 * parseFloat(m[2]) / parseFloat(m[4]);
        bar.style.width = pct + '%';
        if (progressEl) progressEl.setAttribute('aria-valuenow', Math.round(pct));
        statusEl.textContent = m[1].trim();
      } else {
        statusEl.textContent = text || '';
      }
    },
    onRuntimeInitialized: function () {
      booted = true;
      overlay.classList.add('hidden');
      // If some enabled packs failed to materialize (parse error, not a capacity
      // limit -- there is no boot-time budget since lazy-pack landed), tell the user
      // which ones and why (a dismissible banner, not a silent drop).
      try {
        var sk = window.__ysfwMaterializeSkipped;
        if (sk && sk.length) {
          var names = sk.map(function (s) { return s.name || s.id; }).join(', ');
          var n = document.createElement('div');
          n.style.cssText = 'position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:100000;max-width:min(560px,92vw);' +
            'background:rgba(20,14,8,.95);border:1px solid #5a4a2a;border-radius:8px;padding:10px 14px;color:#e6d8b8;font-size:12.5px;line-height:1.5;cursor:pointer';
          n.textContent = '⚠ ' + TXT.packsSkipped(sk.length, names);
          n.title = names;
          n.onclick = function () { if (n.parentNode) n.remove(); };
          document.body.appendChild(n);
          setTimeout(function () { if (n.parentNode) n.remove(); }, 15000);
        }
      } catch (e) {}
      // Persist /home/web_user/Documents to IndexedDB.  Guard against
      // overlapping syncfs calls (interval + visibilitychange/beforeunload, or a
      // slow write): a second syncfs while one is in flight is wasted work and
      // triggers emscripten's "N FS.syncfs operations in flight" warning.
      var syncing = false;
      var flushLogged = false;
      var flush = function () {
        if (syncing) return;
        syncing = true;
        try {
          Module.FS.syncfs(false, function (err) {
            syncing = false;
            // Diagnostic: a save error (e.g. QuotaExceededError when the MEMFS-mounted
            // packs/ tree gets walked into the IndexedDB write) means NOTHING in the
            // Documents tree is persisted — config included.  Log the first outcome so
            // a "settings don't save" report is decisive; errors always log.
            if (err) console.error('[idbfs] flush failed: ' + (err.message || err));
            else if (!flushLogged) { flushLogged = true; console.log('[idbfs] flush ok'); }
          });
        } catch (e) { syncing = false; console.error('[idbfs] flush threw: ' + (e && e.message ? e.message : e)); }
      };
      setInterval(flush, 10000);
      window.addEventListener('visibilitychange', flush);
      window.addEventListener('beforeunload', flush);
      // Native settings (graphics flight.cfg / screen option.cfg / key+joystick
      // ctlassign.cfg) are written by the engine the instant the user hits OK in
      // a config dialog -- via fopen/fwrite/fclose, i.e. FS.close.  Those writes
      // land only in the in-memory FS; the IDBFS round-trip itself is healthy
      // (verified), but without an explicit syncfs the bytes are lost when the
      // user reloads / closes the tab (or a mobile tab is frozen) before the 10s
      // interval flush.  The visibilitychange/beforeunload flush above fires too
      // late: syncfs is async and does not complete before the page is torn
      // down.  So persist proactively -- when a *writable* file under the
      // IDBFS-mounted Documents tree is closed, schedule a debounced flush.
      var origClose = Module.FS.close.bind(Module.FS);
      var closeFlushTimer = null;
      Module.FS.close = function (stream) {
        var r = origClose(stream);
        try {
          if (stream && (stream.flags & 3) !== 0) {            // O_WRONLY | O_RDWR (read-only closes ignored)
            var p = stream.path || '';
            if (p.lastIndexOf('/home/web_user/Documents/', 0) === 0 &&
                p.indexOf('/packs/') < 0) {                    // packs/ is MEMFS, never persisted to IndexedDB
              clearTimeout(closeFlushTimer);
              closeFlushTimer = setTimeout(flush, 800);        // debounce: OK writes 3 cfg files in a burst
            }
          }
        } catch (e) {}
        return r;
      };
    },
    print: function (text) { console.log(text); },
    printErr: (function () {
      // YSFLIGHT's startup shader check prints a benign "Cannot find uniform
      // location ... Could be normal" triplet for uniforms that the GLSL
      // compiler optimized out.  Keep the console readable by default;
      // ?verbose=1 shows everything.
      var verbose = new URLSearchParams(location.search).get('verbose');
      var benign = /^(Called from YsGLSL|Cannot find uniform location|Could be normal since error check|warning: unsupported syscall: __syscall_setsockopt)/;
      return function (text) {
        if (!verbose && benign.test(text)) return;
        console.warn(text);
      };
    })()
  };

  // TURN: fetch short-lived ICE servers (Cloudflare Realtime TURN, minted by the
  // Worker's /turn endpoint) so peers behind symmetric NAT / CGNAT can relay when
  // direct P2P fails — otherwise a cross-machine joiner never receives the host's
  // game state and the aircraft list is empty.  Fired at load so the creds are
  // ready before the user hosts/joins.  The engine game channel reads
  // Module.ysfwIceServers (yssocket) and the pack channel reads window.ysfwPackIce
  // (pack-net.js); both fall back to public STUN if /turn is unconfigured (204) or
  // unreachable.  ?turn=0 forces STUN-only (to reproduce the no-TURN behaviour).
  (function () {
    if (new URLSearchParams(location.search).get('turn') === '0') return;
    try {
      // Expose the mint as a promise so the pre-boot JOIN sync can wait for it before
      // building the pack DataChannel — otherwise a warm-cache joiner races ahead and
      // connects STUN-only (no relay), stranding restrictive-NAT peers (see runJoinSync).
      window.__ysfwTurnReady = fetch('/turn', { method: 'POST' })
        .then(function (r) {
          if (r.ok) return r.json();
          // 204 = TURN secrets unset (graceful STUN-only); 502 = upstream mint failed.
          // Either way there is NO relay, so symmetric-NAT/CGNAT peers can't connect or
          // sync packs.  Warn so a deploy that forgot TURN_KEY_ID/TURN_API_TOKEN is
          // greppable in the Workers logs instead of failing silently for those users.
          console.warn('[turn] no ICE relay (HTTP ' + r.status + ') — STUN-only; restrictive networks (mobile/CGNAT) will fail to connect/sync. Set TURN_KEY_ID + TURN_API_TOKEN to enable a relay.');
          return null;
        })
        .then(function (d) {
          if (d && Array.isArray(d.iceServers) && d.iceServers.length) {
            Module.ysfwIceServers = d.iceServers;
            window.ysfwPackIce = d.iceServers;
            console.log('[turn] ICE relay ready (' + d.iceServers.length + ' server group(s))');
          }
        })
        .catch(function () { console.warn('[turn] /turn fetch failed — STUN-only fallback'); });
    } catch (e) {}
  })();

  window.addEventListener('error', function (e) {
    if (!booted) statusEl.textContent = 'Error: ' + e.message;
  });

  // PWA: cache the app for instant reload and offline play.
  //
  // Update notification: sw.js skipWaiting()s and the HTML is served
  // network-first, so a RELOAD always picks up a new deploy -- but a long-lived
  // tab never learns one happened.  In multiplayer that silently leaves one
  // player on an old build (real incident: a joiner's stale client could not
  // use a pack field until a hard reload).  So: check for updates periodically
  // and when the tab becomes visible, and when a new worker takes over show a
  // small reload chip.  Never auto-reload -- the player may be mid-flight.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        // Only a page that ALREADY had a controller is seeing an update
        // (first-ever install also fires updatefound; no chip for that).
        var hadController = !!navigator.serviceWorker.controller;
        function showUpdateChip() {
          if (!hadController || document.getElementById('ysfw-update-chip')) return;
          var ja = ((document.documentElement.lang || navigator.language || '') + '').toLowerCase().indexOf('ja') === 0;
          var chip = document.createElement('div');
          chip.id = 'ysfw-update-chip';
          chip.textContent = ja ? '新しいバージョンがあります — タップで更新' : 'Update available — tap to reload';
          chip.style.cssText = 'position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10000;' +
            'background:rgba(30,90,180,.92);color:#fff;padding:9px 16px;border-radius:8px;' +
            'font:14px system-ui,sans-serif;cursor:pointer;user-select:none;box-shadow:0 2px 10px rgba(0,0,0,.4)';
          chip.onclick = function () { location.reload(); };
          document.body.appendChild(chip);
        }
        if (reg.waiting) showUpdateChip();
        reg.addEventListener('updatefound', function () {
          var w = reg.installing;
          if (!w) return;
          w.addEventListener('statechange', function () {
            if (w.state === 'activated' || w.state === 'waiting') showUpdateChip();
          });
        });
        function checkForUpdate() { try { reg.update().catch(function () {}); } catch (e) {} }
        setInterval(checkForUpdate, 60 * 60 * 1000);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') checkForUpdate();
        });
      }).catch(function () {});
    });
  }

  // ---- WebGL state shadow ---------------------------------------------------
  // The engine (ysgl) brackets nearly every draw with save/restore state
  // queries: YsGLSLUse3DRenderer reads GL_CURRENT_PROGRAM on EVERY renderer
  // activation (1-4 per shell node per frame, ysglsl3ddrawing.c:860) and
  // YsHasShellExtVboSet::Render reads GL_FRONT_FACE once per node
  // (ysshellextgl_gl2.cpp:40), plus viewport/blend-func reads elsewhere
  // (fsopengl2.0.cpp, fsparticlegl2.0.cpp, ysglslplain2ddrawing.c).  In
  // WebGL, getParameter is a synchronous round trip toward the GPU process
  // -- profiled at ~78% of ALL engine CPU time in VR (docs/perf-vr-72hz.md).
  // Shadow the handful of states the engine actually queries: record them in
  // the setter wrappers, answer those getParameter enums from the shadow.
  // Every other pname falls through to the real getParameter untouched.
  // (Correct because ALL writes to these states go through the same wrapped
  // methods, whoever the caller is; the engine only ever uses sane viewport/
  // blend arguments, so GL's clamp/invalid-arg edge cases don't diverge.)
  (function () {
    function installShadow(gl) {
      if (gl.__ysfwStateShadow) return;
      gl.__ysfwStateShadow = true;
      var st = {
        program: null,
        frontFace: 0x0901, // GL_CCW -- the GL default
        viewport: [0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight], // GL default at creation
        srcRGB: 1, dstRGB: 0, srcA: 1, dstA: 0 // GL_ONE / GL_ZERO defaults
      };
      var useProgram = gl.useProgram, frontFace = gl.frontFace,
          viewport = gl.viewport, blendFunc = gl.blendFunc,
          blendFuncSeparate = gl.blendFuncSeparate, getParameter = gl.getParameter;
      gl.useProgram = function (p) { st.program = p || null; return useProgram.call(this, p); };
      gl.frontFace = function (m) { st.frontFace = m; return frontFace.call(this, m); };
      gl.viewport = function (x, y, w, h) { st.viewport = [x | 0, y | 0, w | 0, h | 0]; return viewport.call(this, x, y, w, h); };
      gl.blendFunc = function (s, d) { st.srcRGB = st.srcA = s; st.dstRGB = st.dstA = d; return blendFunc.call(this, s, d); };
      gl.blendFuncSeparate = function (sr, dr, sa, da) { st.srcRGB = sr; st.dstRGB = dr; st.srcA = sa; st.dstA = da; return blendFuncSeparate.call(this, sr, dr, sa, da); };
      gl.getParameter = function (pname) {
        switch (pname) {
          case 0x8B8D: return st.program;                 // CURRENT_PROGRAM (emscripten's glue maps the object back to its GL id)
          case 0x0B46: return st.frontFace;               // FRONT_FACE
          case 0x0BA2: return new Int32Array(st.viewport); // VIEWPORT -- fresh copy, like the real call
          case 0x80C9: return st.srcRGB;                  // BLEND_SRC_RGB
          case 0x80C8: return st.dstRGB;                  // BLEND_DST_RGB
          case 0x80CB: return st.srcA;                    // BLEND_SRC_ALPHA
          case 0x80CA: return st.dstA;                    // BLEND_DST_ALPHA
        }
        return getParameter.call(this, pname);
      };
    }
    var getCtx = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function (type, attrs) {
      var ctx = getCtx.call(this, type, attrs);
      if (ctx && ('webgl2' === type || 'webgl' === type || 'experimental-webgl' === type)) installShadow(ctx);
      return ctx;
    };
  })();

  function loadEngine() {
    var s = document.createElement('script');
    s.async = true;
    s.src = ASSET.js;
    document.body.appendChild(s);
  }

  // ---- Bottom-right control row --------------------------------------------
  // ONE right-aligned HORIZONTAL row pinned to the bottom-right corner, so all the
  // shell controls line up on a single line instead of being scattered (was: help
  // bottom-left, Room chip top-right) or stacked.  Left-to-right by CSS `order`:
  //   order 0 : Room chip (hosting) / connection badge (menu) -- MUTUALLY EXCLUSIVE,
  //             so they share the leftmost slot and never both show
  //   order 1 : "? ヘルプ" help button
  //   order 2 : "⛶ 全画面" fullscreen button (right end = the corner)
  // The row's right edge is pinned (right:8px) and it grows leftward, so the
  // rightmost item (fullscreen) holds the corner while items to its left appear/
  // disappear with no position jump.  align-items:flex-end keeps unequal-height
  // items on a common bottom; order fixes left/right independent of which IIFE
  // appends each child.  The container is click-through (pointer-events:none,
  // re-enabled per child) so the gaps don't swallow canvas clicks.
  function ysfwBRStack() {
    var s = document.getElementById('ysfw-br-stack');
    if (s) return s;
    s = document.createElement('div');
    s.id = 'ysfw-br-stack';
    s.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:99999;display:flex;flex-direction:row;align-items:flex-end;gap:6px;pointer-events:none';
    document.body.appendChild(s);
    return s;
  }

  // ---- On-screen multiplayer UI: connection badge + invite link ------------
  // Three states, driven by globalThis.ysfwInFlight (set by the engine's
  // ChangeRunMode) and globalThis.ysfwRtc.host (set while this browser hosts):
  //   - menu (not flying)        -> connection badge only
  //   - hosting a server         -> clickable Room ID chip (click = copy invite)
  //   - flying as client / solo  -> nothing
  (function () {
    // Room ID chip (shown only while hosting): the Room ID itself is the copy
    // control — hover shows a pointer cursor, a 📋 icon hints it is clickable,
    // and clicking copies the invite link /?join=<room>.  It replaces (and
    // hides) the engine's #ysfw-room-overlay.
    var chip = null;
    // Pin the live Room ID into the URL (?room=<code>) the moment we start hosting,
    // so a full page reload re-hosts the SAME code and previously-shared invite
    // links (/?join=<code>) keep working.  Without this the host mints a fresh
    // random code on every (re)host, silently killing old links — one half of the
    // "after a while, players can't rejoin" report (the other half is the signaling
    // reconnect in yssocket/pack-net).  One-shot; preserves any other query params.
    var roomPinned = false;
    function pinRoomUrl(code) {
      if (roomPinned || !code) return;
      roomPinned = true;
      try {
        var u = new URL(location.href);
        if (u.searchParams.get('room') !== code) {
          u.searchParams.set('room', code);
          history.replaceState(history.state, '', u.toString());
        }
        Module.ysfwRoomCode = code; // keep any later read in sync
      } catch (e) {}
    }
    function ensureChip() {
      if (chip) return chip;
      chip = document.createElement('div');
      chip.id = 'ysfw-room-chip';
      // Leftmost slot (order:0) of the bottom-right row, shared with the connection
      // badge (mutually exclusive: chip only while hosting, badge only in the menu).
      chip.style.cssText = 'order:0;pointer-events:auto;background:rgba(10,14,20,.85);color:#cfd8e3;padding:8px 14px;border-radius:6px;font:14px monospace;cursor:pointer;user-select:none;display:none';
      chip.title = TXT.chipCopyTitle;
      chip.onclick = function () {
        var R = globalThis.ysfwRtc;
        var code = (R && R.host && R.host.room) || Module.ysfwRoomCode;
        if (!code) return;
        var url = location.origin + '/?join=' + code;
        var done = function () {
          chip._copied = true;
          chip.textContent = TXT.chipCopied;
          setTimeout(function () { chip._copied = false; }, 1600);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(url).then(done, done);
        } else {
          var ta = document.createElement('textarea');
          ta.value = url; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          ta.remove(); done();
        }
      };
      ysfwBRStack().appendChild(chip);
      return chip;
    }
    function renderChip(code, connecting) {
      var c = ensureChip();
      if (c._copied) return;  // keep the "copied" confirmation visible briefly
      c.textContent = 'Room: ' + code + (connecting ? TXT.connecting + '📋' : '  📋');
    }

    // Connection badge: a one-shot STUN probe hinting whether direct P2P is
    // likely.  Same mapped port from two STUN servers => cone NAT (P2P OK);
    // different ports => symmetric NAT (a TURN relay would be needed).
    var badge = null, checkState = 'idle';
    function ensureBadge() {
      if (badge) return badge;
      badge = document.createElement('button');
      badge.id = 'ysfw-conn-badge';
      // Leftmost slot (order:0) of the bottom-right row.  Shares that slot with the
      // Room chip, which is fine: the badge shows only in the MENU and the chip only
      // while HOSTING, so they are never visible at once.  flex lays it out — no more
      // manual right-edge math (positionBadge is now a no-op).
      badge.style.cssText = 'order:0;pointer-events:auto;font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid #2a3647;background:#0d141d;color:#cfd8e3;cursor:pointer;display:none';
      badge.title = TXT.badgeTitle;
      badge.onclick = function () { if (checkState !== 'running') runCheck(); };
      ysfwBRStack().appendChild(badge);
      return badge;
    }
    // Park the badge just left of the fullscreen button by measuring that button's
    // live left edge (its width varies with the localized label).  If the button is
    // absent (Fullscreen API unsupported -> it is never created) fall back to the
    // bottom-right corner with the same 8px margin.
    // No-op: the badge now lays out as a flex child of the bottom-right row, so its
    // position is automatic.  Kept (callable) so the render loop's call site is
    // unchanged; ensureBadge() is still needed there to create the element.
    function positionBadge() { ensureBadge(); }
    function setBadge(text, title) {
      var b = ensureBadge();
      b.textContent = text;
      if (title) b.title = title;
    }

    function srflxPort(iceServer, timeoutMs) {
      return new Promise(function (resolve) {
        var pc, done = false;
        var finish = function (p) { if (!done) { done = true; try { pc.close(); } catch (e) {} resolve(p); } };
        try { pc = new RTCPeerConnection({ iceServers: [{ urls: iceServer }] }); }
        catch (e) { return resolve(null); }
        try { pc.createDataChannel('probe'); } catch (e) {}
        pc.onicecandidate = function (e) {
          if (!e.candidate) return finish(null);
          var parts = (e.candidate.candidate || '').split(' ');
          if (parts[7] === 'srflx') finish(parts[5]); // server-reflexive mapped port
        };
        pc.createOffer().then(function (o) { return pc.setLocalDescription(o); }).catch(function () { finish(null); });
        setTimeout(function () { finish(null); }, timeoutMs || 4000);
      });
    }
    // Is a TURN relay actually available?  The /turn fetch (top of this file)
    // populates Module.ysfwIceServers / window.ysfwPackIce with the Cloudflare
    // iceServers; a turn: URL there means even a symmetric-NAT line can relay.
    function turnAvailable() {
      var ice = (window.Module && window.Module.ysfwIceServers) || window.ysfwPackIce;
      return Array.isArray(ice) && JSON.stringify(ice).indexOf('turn:') !== -1;
    }
    function runCheck() {
      checkState = 'running';
      setBadge(TXT.badgeChecking, TXT.badgeCheckingTitle);
      Promise.all([
        srflxPort('stun:stun.l.google.com:19302'),
        srflxPort('stun:stun1.l.google.com:19302')
      ]).then(function (ports) {
        checkState = 'done';
        if (!ports[0] && !ports[1]) {
          setBadge(TXT.badgeOffline, TXT.badgeOfflineTitle);
        } else if (ports[0] && ports[1] && ports[0] !== ports[1]) {
          // Symmetric NAT: with TURN configured the relay carries it (informational);
          // without TURN it is the old "may not connect to some peers" warning.
          if (turnAvailable()) setBadge(TXT.badgeRelay, TXT.badgeRelayTitle);
          else setBadge(TXT.badgeSymmetric, TXT.badgeSymmetricTitle);
        } else {
          setBadge(TXT.badgeDirect, TXT.badgeDirectTitle);
        }
      });
    }

    setInterval(function () {
      if (!booted) return;
      var roomEl = document.getElementById('ysfw-room-overlay');
      var R = globalThis.ysfwRtc;
      var inFlight = !!globalThis.ysfwInFlight;
      var host = R && R.host;
      if (!inFlight) {
        // MENU: connection badge only.
        ensureBadge().style.display = 'block';
        positionBadge();  // ensures the badge exists; layout is handled by the flex row
        if (checkState === 'idle') runCheck();
        if (chip) chip.style.display = 'none';
        if (roomEl) roomEl.style.display = 'none';
      } else if (host && !host.failed) {
        // HOSTING: clickable Room ID chip (click to copy invite link); no badge.
        // The chip replaces the engine overlay, so hide #ysfw-room-overlay.
        if (badge) badge.style.display = 'none';
        if (roomEl) roomEl.style.display = 'none';
        pinRoomUrl(host.room);
        renderChip(host.room, !host.ok);
        ensureChip().style.display = 'block';
      } else if (host && host.failed) {
        // Host setup failed: show the engine overlay's specific error message.
        if (badge) badge.style.display = 'none';
        if (chip) chip.style.display = 'none';
        if (roomEl) roomEl.style.display = '';
      } else {
        // FLYING as client/solo: hide everything.
        if (badge) badge.style.display = 'none';
        if (chip) chip.style.display = 'none';
        if (roomEl) roomEl.style.display = 'none';
      }
    }, 800);

    // Resume after a backgrounded/frozen tab: a hidden mobile tab (screen lock,
    // app switch) freezes JS timers, so the host's keepalive ping stops and its
    // signaling socket is torn down — the room vanishes for late joiners.  The
    // engine host (yssocket) and pack host (pack-net) reconnect on their own ws
    // close, but a frozen tab also froze their backoff timers; on becoming visible
    // again, kick an immediate reconnect.  (pack-net listens for itself too; this
    // covers the engine game host, whose reconnect we expose as R.host.reconnect.)
    function resumeSignaling() {
      if (document.visibilityState && document.visibilityState !== 'visible') return;
      var R = globalThis.ysfwRtc;
      if (R && R.host && R.host.reconnect) { try { R.host.reconnect(); } catch (e) {} }
    }
    window.addEventListener('visibilitychange', resumeSignaling);
    window.addEventListener('pageshow', resumeSignaling);
  })();

  // ---- Flight deep links: return to the originating page when the flight ends --
  // ?freeflight= / ?endurance= boot straight into a flight.  The engine reports
  // flight state through globalThis.ysfwInFlight (set by its ChangeRunMode).
  // When the user exits the flight back to the engine menu, ysfwInFlight flips
  // true -> false; we treat that edge as "flight over" and navigate back.  If
  // ?return=<page> is present and passes the whitelist check we go there;
  // otherwise we fall back to the clean top-page URL.  Armed only for flight
  // deep-link launches, so normal in-engine menu navigation after a manual
  // boot is untouched.  We latch on having actually entered flight first, so the
  // initial pre-boot false never counts as an exit.
  //
  // SECURITY: open-redirect guard — only bare filenames on the explicit whitelist
  // are accepted.  Any value containing / \ : or .. is rejected regardless.
  (function () {

    btn.style.cssText = 'order:1;pointer-events:auto;z-index:99999;font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid #2a3647;background:rgba(13,20,29,.85);color:#cfd8e3;cursor:pointer';

  // ---- Mobile touch controls (touch devices, in-flight only) ---------------
  // A minimal on-screen control set so a phone can fly without a keyboard/mouse,
  // WITHOUT an engine rebuild: it drives the engine through synthetic events the
  // port already listens for.
  //   * Left stick pad -> a BUTTONLESS `mousemove` on #canvas.  The engine's
  //     mouse-as-stick (FsPollJoystick in fsplatform_emscripten.cpp reads the
  //     cursor position as aileron/elevator) turns position into pitch/roll;
  //     buttonless means it never fires.  Releasing recenters (mousemove to canvas
  //     center) so the stick returns to neutral -- which the engine's bare
  //     touch=LBUTTONDOWN emulation cannot do.
  //   * Throttle / fire / gear -> synthetic KeyboardEvent on window (Q/A, Space,
  //     KeyG), the exact e.code values FsKeyDownCallback reads.
  // Edges only (the centre/view stays clear), semi-transparent, auto-fades when
  // idle, and only appears in flight on a touch device.
  (function () {

    // keyboard/mouse + the controls legend.  Phone vs tablet are distinguished by the
    // shorter viewport edge: phone is a deliberate TASTER (a small control set + a
    // nudge toward PC/tablet); tablet has room for the fuller rail (added later).

      var y = r.top + r.height / 2 + defY * denom;

    var wrap = document.createElement('div');
    wrap.id = 'ysfw-touch';
    wrap.style.cssText = 'position:fixed;inset:0;z-index:30;pointer-events:none;display:none;transition:opacity .4s';
    document.body.appendChild(wrap);
    var idleTimer = null;
    function wake() { wrap.style.opacity = '0.92'; if (idleTimer) clearTimeout(idleTimer); idleTimer = setTimeout(function () { wrap.style.opacity = '0.32'; }, 4000); }

    knob.style.cssText = 'position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(77,163,255,.55);border:1px solid rgba(77,163,255,.9)';

    wrap.appendChild(pad);
    var padId = null, padR = 65;
    function padMove(t) {

      var dy = (t.clientY - (r.top + r.height / 2)) / padR;

    if (tier === 'tablet') {
      var flapLbl = document.createElement('div');
      flapLbl.textContent = T.flap;

      var radar = mkBtn(T.radar, 'position:absolute;right:14px;top:48px;width:88px;height:40px;font-size:12px');
      radar.addEventListener('touchstart', function (e) { e.preventDefault(); tap('Digit3'); wake(); }, { passive: false });
      var ap = mkBtn(T.ap, 'position:absolute;right:14px;top:96px;width:88px;height:40px;font-size:12px');

        // and "host a room" next to the pack panel; the engine still loads (for
        // solo), but submitting either form navigates away to its deep-link flow
        // before main() matters.  (A bare ?host= lands here and auto-expands the
        // host form.)  Direct boots skip both forms — they'd only flash over the
        // loading overlay of an already-decided launch.
        renderManualJoinForm();
        renderHostForm();
      }
      loadEngine();
    }
