<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<script type="module" src="packs-ui.js"></script>
<script type="module" src="pack-net.js"></script>
<title>YSFLIGHT web</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    outline: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    /* `safe` so that when the content (e.g. a tall pack panel) is taller than the
       viewport it falls back to top-alignment and the overflow stays scrollable
       instead of being clipped off the top of a centered flex container. */
    justify-content: safe center;
    overflow-y: auto;
    padding: 16px 0;
    box-sizing: border-box;
    background: #0a0e14;
    color: #cfd8e3;
    font-family: system-ui, sans-serif;
    transition: opacity 0.4s;
    z-index: 10;
  }
  #overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #overlay h1 {
    font-weight: 600;
    letter-spacing: 0.08em;
  }
  #progress {
    width: min(420px, 80vw);
    height: 8px;
    background: #1d2633;
    border-radius: 4px;
    overflow: hidden;
    margin-top: 16px;
  }
  #progress > div {
    height: 100%;
    width: 0;
    background: #4da3ff;
    transition: width 0.2s;
  }
  #status {
    margin-top: 12px;
    font-size: 13px;
    color: #8fa3bb;
    min-height: 1.2em;
  }
  #note {
    margin-top: 28px;
    font-size: 12px;
    color: #5d7290;
    max-width: 480px;
    text-align: center;
    line-height: 1.6;
  }
  /* One-line value proposition under the loading bar — what this is + how to start.
     Static DOM so it paints immediately during the (~23MB) .data download, before
     any CTA renders.  Brighter than the attribution #note, dimmer than #status. */
  #pitch {
    margin-top: 14px;
    font-size: 13.5px;
    color: #9db4d0;
    max-width: 460px;
    text-align: center;
    line-height: 1.65;
    padding: 0 16px;
  }
</style>
</head>
<body>
<div id="overlay">
  <h1>YSFLIGHT web</h1>
  <div id="progress"><div id="bar"></div></div>
  <div id="status">loading...</div>
  <div id="pitch"></div>
  <div id="note">
    YS FLIGHT SIMULATOR (c) Soji Yamakawa (CaptainYS) — WebAssembly port.<br>
    <span id="note-src">元データ・ソースコード: </span><a href="https://github.com/captainys/YSFLIGHT" style="color:#4da3ff">captainys/YSFLIGHT</a>
  </div>
</div>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<script>
  // Asset names; scripts/build.sh rewrites this line with content-hashed names.
  var ASSET = {js:'ysflight32_gl2.js',wasm:'ysflight32_gl2.wasm',data:'ysflight32_gl2.data',build:'dev'}; // __ASSET_LINE__

  var overlay = document.getElementById('overlay');
  var bar = document.getElementById('bar');
  var statusEl = document.getElementById('status');
  var booted = false;

  // Shell UI locale.  Mirrors the engine's own ja/en selection (?lang, else the
  // browser locale): the wasm UI already localizes, this localizes the pre-boot
  // shell (loading note, connection badge, Room chip, join forms, pack panel).
  // Exposed on window so packs-ui.js shares the same choice.
  window.ysfwLang = (function () {
    var q = new URLSearchParams(location.search).get('lang');
    var l = String(q || navigator.language || 'en').toLowerCase();
    return l.indexOf('ja') === 0 ? 'ja' : 'en';
  })();
  var TXT = ({
    ja: {
      note: '元データ・ソースコード: ',
      pitch: 'ブラウザで動く無料フライトシム。「今すぐ飛ぶ」で機体を選べば即離陸（スマホ対応）。',
      chipCopyTitle: 'クリックで招待リンクをコピー',
      chipCopied: '✓ 招待リンクをコピーしました',
      connecting: '（接続中…）',
      badgeTitle: '対戦の接続性チェック（クリックで再確認）',
      badgeChecking: '接続を確認中…',
      badgeCheckingTitle: '対戦の接続性をチェックしています',
      badgeOffline: '🟠 接続を確認できません',
      badgeOfflineTitle: 'STUN サーバに到達できませんでした。ネットワーク／ファイアウォール、またはオフラインの可能性があります（TURN の TLS/443 経由なら繋がる場合もあります）。クリックで再確認。',
      badgeRelay: '🟡 TURN 中継で接続',
      badgeRelayTitle: 'この回線は通信タイプが厳しめ（対称NAT）で直結できないことがありますが、TURN リレー経由で接続できます。直結よりわずかに遅延が増えます。クリックで再確認。',
      badgeSymmetric: '🟡 一部の相手と繋がらないかも',
      badgeSymmetricTitle: 'この回線は通信タイプが厳しめ（対称NAT）です。TURN 中継が未設定のため、相手も同じタイプだと直接つながらないことがあります。クリックで再確認。',
      badgeDirect: '🟢 マルチプレイOK',
      badgeDirectTitle: 'この回線は対戦に適しています（多くの相手と直接つながります）。クリックで再確認。',
      joinLabel: 'Room ID で参加',
      joinToggle: '友達に招待された？ Room ID で参加',
      joinNamePlaceholder: '名前（任意）',
      joinBtn: 'ルームに参加',
      errRoomEmpty: 'Room ID を入力してください',
      errRoomInvalid: 'Room ID は英数字・- ・_（14文字以内）で入力してください',
      inviteNameLabel: function (room) { return 'Room ' + room + ' に参加 — 名前を入力'; },
      inviteJoinBtn: '参加する',
      syncError: '(同期エラー)',
      joinSyncing: 'ホストのパックを同期中…',
      joinProgress: function (done, total) { return 'ホストのパックを同期中… ' + done + '/' + total; },
      help: {
        title: '操作 / Controls',
        toggleTitle: '操作ガイド（? キーで開閉）',
        openHint: '? 操作',
        close: '閉じる',
        fsOpen: '⛶ 全画面',
        fsTitle: '全画面切替（F11 / ⌃⌘F）',
        intro: 'ジョイスティック未接続なら マウスが操縦桿 です。',
        rows: [
          ['マウス移動', '操縦桿（上下＝ピッチ / 左右＝ロール）'],
          ['左クリック / Space', '武器発射'],
          ['Q / A', 'スロットル ＋ / −'],
          ['Z / X / C', 'ラダー 左 / 中央 / 右'],
          ['Tab', 'アフターバーナー'],
          ['G', '降着装置（ギア）'],
          ['B', 'スポイラー＆ブレーキ'],
          ['R / F', 'フラップ 上げ / 下げ'],
          ['F1〜F4', '視点（コックピット / 外部 / 相手機 / 兵装）'],
          ['ホイール', 'ズーム'],
          ['矢印キー', '視点の向き'],
        ],
      },
      touch: { fire: '発射', gear: 'ギア', thr: '推力', wsel: '武器切替', view: '視点', rudder: 'ラダー', flap: 'フラップ', radar: 'レーダー', ap: '自動操縦', nudge: 'お試し版 — PC / タブレットだと全機能で快適です' },
      host: {
        toggle: '友達と対戦したい？（ホストの始め方）',
        steps: [
          '「▶ プレイ開始」を押してゲームを起動',
          'ゲーム内メニューで Network → Start Server を選ぶ',
          'ホストで飛び始めると画面右上に「Room: 番号 📋」が出ます。クリックで招待リンクをコピーし、友達に送って参加してもらいましょう',
        ],
      },
    },
    en: {
      note: 'Source & assets: ',
      pitch: 'A free flight sim, right in your browser — pick a Quick Flight aircraft to take off (touch-friendly).',
      chipCopyTitle: 'Click to copy the invite link',
      chipCopied: '✓ Invite link copied',
      connecting: ' (connecting…)',
      badgeTitle: 'Multiplayer connectivity check (click to re-check)',
      badgeChecking: 'Checking connection…',
      badgeCheckingTitle: 'Checking multiplayer connectivity',
      badgeOffline: '🟠 Can’t check connection',
      badgeOfflineTitle: 'Could not reach a STUN server — you may be offline or behind a firewall (TURN over TLS/443 may still connect). Click to re-check.',
      badgeRelay: '🟡 Connects via TURN relay',
      badgeRelayTitle: 'This network is restrictive (symmetric NAT) so direct P2P may fail, but you can still connect through the TURN relay. Slightly higher latency than a direct connection. Click to re-check.',
      badgeSymmetric: '🟡 Some peers may not connect',
      badgeSymmetricTitle: 'This network is restrictive (symmetric NAT). No TURN relay is configured, so peers on the same kind of network may not connect directly. Click to re-check.',
      badgeDirect: '🟢 Multiplayer OK',
      badgeDirectTitle: 'This network is good for multiplayer (direct connection to most peers). Click to re-check.',
      joinLabel: 'Join by Room ID',
      joinToggle: 'Have an invite? Join by Room ID',
      joinNamePlaceholder: 'Name (optional)',
      joinBtn: 'Join room',
      errRoomEmpty: 'Enter a Room ID',
      errRoomInvalid: 'Room ID: letters, digits, - and _ only (max 14 chars)',
      inviteNameLabel: function (room) { return 'Joining Room ' + room + ' — enter your name'; },
      inviteJoinBtn: 'Join',
      syncError: '(sync error)',
      joinSyncing: 'Syncing the host’s add-ons…',
      joinProgress: function (done, total) { return 'Syncing the host’s add-ons… ' + done + '/' + total; },
      help: {
        title: 'Controls',
        toggleTitle: 'Controls guide (press ? to toggle)',
        openHint: '? Help',
        close: 'Close',
        fsOpen: '⛶ Fullscreen',
        fsTitle: 'Toggle fullscreen (F11 / ⌃⌘F)',
        intro: 'With no joystick, your mouse is the control stick.',
        rows: [
          ['Move mouse', 'Control stick (up/down = pitch, left/right = roll)'],
          ['Left click / Space', 'Fire weapon'],
          ['Q / A', 'Throttle + / −'],
          ['Z / X / C', 'Rudder left / center / right'],
          ['Tab', 'Afterburner'],
          ['G', 'Landing gear'],
          ['B', 'Spoiler & brake'],
          ['R / F', 'Flaps up / down'],
          ['F1–F4', 'View (cockpit / outside / target / weapon)'],
          ['Wheel', 'Zoom'],
          ['Arrow keys', 'Look around'],
        ],
      },
      touch: { fire: 'Fire', gear: 'Gear', thr: 'Thrust', wsel: 'Weapon', view: 'View', rudder: 'Rudder', flap: 'Flaps', radar: 'Radar', ap: 'A/P', nudge: 'Taster — best with all controls on PC / tablet' },
      host: {
        toggle: 'Want to play with friends? (How to host)',
        steps: [
          'Press “▶ Play” to launch the game',
          'In the engine menu, open Network → Start Server',
          'Once you’re flying as host, a “Room: <id> 📋” chip appears top-right — click it to copy the invite link and send it to your friends',
        ],
      },
    },
  })[window.ysfwLang];
  document.documentElement.lang = window.ysfwLang;
  (function () {
    var n = document.getElementById('note-src'); if (n) n.textContent = TXT.note;
    var p = document.getElementById('pitch'); if (p) p.textContent = TXT.pitch;
  })();

  var Module = {
    canvas: document.getElementById('canvas'),
    // WebRTC multiplayer: signaling defaults to this site's own /signal endpoint
    // (a Cloudflare Worker + Durable Object; see worker/signal.js).  Game traffic
    // is peer-to-peer over WebRTC DataChannels with public STUN.
    //   ?signal=wss://host/path  overrides the signaling endpoint
    //   ?room=12345678           fixes the host's room code (8-digit numeric)
    //   ?join=12345678           pre-fills the Room ID to join (invite links)
    ysfwSignalUrl: new URLSearchParams(location.search).get('signal') ||
      ((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/signal'),
    ysfwRoomCode: new URLSearchParams(location.search).get('room') || undefined,
    ysfwJoinRoom: new URLSearchParams(location.search).get('join') || undefined,
    locateFile: function (path) {
      if (path === 'ysflight32_gl2.wasm') return ASSET.wasm;
      if (path === 'ysflight32_gl2.data') return ASSET.data;
      return path;
    },
    // UI language follows the browser locale (ja/en); override with ?lang=ja etc.
    // ?freeflight=AIRPLANE,FIELD[,POSITION] jumps straight into a flight.
    arguments: (function () {
      var a = [];
      var q = new URLSearchParams(location.search);
      var lang = q.get('lang');
      if (lang) a.push('-language', lang);
      var ff = q.get('freeflight');
      if (ff) {
        var p = ff.split(',');
        // Default start position: NORTH10000_01 is an airborne start that exists in
        // every bundled field's .stp (verified).  The old default 'NORTH3000' is in
        // NO .stp, so a bare ?freeflight=AIRCRAFT silently failed to spawn.
        a.push('-freeflight', p[0], p[1] || 'ATSUGI_AIRBASE', p[2] || 'NORTH10000_01');
      }
      return a;
    })(),
    preRun: [function () {
      // Let YSFLIGHT's locale detection see the browser language.
      try {
        Module.ENV.LANG = (navigator.language || 'en').replace('-', '_') + '.UTF-8';
      } catch (e) {}
      // Persist user config (/home/web_user/Documents) in IndexedDB.
      var FS = Module.FS, IDBFS = Module.IDBFS;
      try { FS.mkdir('/home/web_user/Documents'); } catch (e) {}
      FS.mount(IDBFS, {}, '/home/web_user/Documents');
      Module.addRunDependency('idbfs-load');
      FS.syncfs(true, function () {
        // Pre-boot add-on pack management.  Hold a run dependency so the engine's
        // one-time template scan (a few frames into main) runs only after packs
        // are in place — no reload needed.  Three flows:
        //   manual launch -> hold the gate, show the pack panel, release on play
        //   ?join=<room>  -> hold the gate, sync the host's packs P2P, release (M6)
        //   ?freeflight   -> boot straight in (no host to sync from)
        var gateReleased = false;
        function releaseGate() {
          if (gateReleased) return;
          if (Module.__ysfwGateHeld) {
            Module.removeRunDependency('ysfw-packs');
            Module.__ysfwGateHeld = false;
          }
          gateReleased = true;
        }
        try {
          var q = new URLSearchParams(location.search);
          var joinRoom = Module.ysfwJoinRoom;
          var freeflight = q.get('freeflight');
          Module.__ysfwUserDir = '/home/web_user/Documents/YSFLIGHT.COM/YSFLIGHT';
          try { FS.mkdirTree(Module.__ysfwUserDir); } catch (e) {}
          // Path A pack storage: payload lives in OPFS (on disk, deduped).  Mount
          // MEMFS on the user dir's packs/ so materialized payload is ephemeral and
          // is NOT written to IndexedDB by the periodic syncfs.  Then materialize
          // every enabled pack from OPFS before main()'s template scan, gated by a
          // run dependency so the engine waits for the payload to be in place.
          try { FS.mkdirTree(Module.__ysfwUserDir + '/packs'); } catch (e) {}
          try { FS.mount(FS.filesystems.MEMFS, {}, Module.__ysfwUserDir + '/packs'); } catch (e) {}
          Module.addRunDependency('ysfw-materialize');
          Promise.resolve(window.ysfwPacks && window.ysfwPacks.materializeEnabled && window.ysfwPacks.materializeEnabled())
            .catch(function (e) { console.warn('[packs] pre-boot materialize: ' + (e && e.message ? e.message : e)); })
            .then(function () { Module.removeRunDependency('ysfw-materialize'); });
          if (joinRoom) {
            // M6/M7: hold the gate and OBTAIN the host's enabled packs before
            // main() — Option B (self-fetch each pack's advertised URL) with a
            // fallback to Option A (host P2P push).  A missing REQUIRED field is
            // fatal in the engine, so on failure we show an explicit panel
            // (Retry / play Solo) instead of booting silently into a broken join.
            Module.addRunDependency('ysfw-packs');
            Module.__ysfwGateHeld = true;
            Module.__ysfwJoinSync = true;
            window.__ysfwFsReady = true;
            if (window.ysfwPacksInit) window.ysfwPacksInit();
            // Solo = abandon the join: drop the -client args (set by the join IIFE
            // below) so the engine boots single-player rather than connecting to a
            // host whose required field we could not obtain, then release the gate.
            // Safe to mutate Module.arguments here: main() has not run (gate held).
            function bootSolo() {
              try {
                var ci = Module.arguments.indexOf('-client');
                if (ci >= 0) Module.arguments = Module.arguments.slice(0, ci);
              } catch (e) {}
              releaseGate();
            }
            // Re-runnable so the obtain-failure panel's "Retry" can try again (M7).
            function runJoinSync() {
              // Show live sync activity instead of a frozen "loading…" bar (the sync
              // can run up to the 90s backstop).  Set it HERE — inside preRun, after
              // the .data download, where Emscripten's setStatus has gone quiet so it
              // is not clobbered (in the name-form go() it would be overwritten by the
              // "Downloading data…" progress).  Writes no-op once the gate releases.
              if (!gateReleased) statusEl.textContent = TXT.joinSyncing;
              var onProgress = function (done, total) {
                if (gateReleased) return;
                statusEl.textContent = total ? TXT.joinProgress(done, total) : TXT.joinSyncing;
              };
              var doSync = (window.ysfwPackNet && window.ysfwPackNet.syncAsJoiner)
                ? window.ysfwPackNet.syncAsJoiner(joinRoom, onProgress)
                : Promise.resolve(null);
              return doSync.then(function (r) {
                // If the gate already went (backstop fired, or the user chose Solo
                // on a prior attempt), a late-resolving sync must not pop a panel
                // over an already-booting engine.
                if (gateReleased) return;
                if (r) console.log('[pack-net join] pre-boot sync: ' + JSON.stringify(r));
                if (r && r.requiredFailed && r.requiredFailed.length &&
                    window.ysfwPacks && window.ysfwPacks.showJoinFailure) {
                  window.ysfwPacks.showJoinFailure(r.requiredFailed, { onRetry: runJoinSync, onSolo: bootSolo });
                  return;
                }
                releaseGate();
              }, function (e) {
                if (gateReleased) return;
                console.warn('[pack-net join] pre-boot sync failed: ' + (e && e.message ? e.message : e));
                // An unexpected error is still an obtain failure — surface the UX,
                // never hang the boot silently.
                if (window.ysfwPacks && window.ysfwPacks.showJoinFailure) {
                  window.ysfwPacks.showJoinFailure([{ id: '', name: TXT.syncError, categories: [] }], { onRetry: runJoinSync, onSolo: bootSolo });
                } else {
                  releaseGate();
                }
              });
            }
            // Absolute backstop: every sync leg has its own timeout, but if the
            // machinery somehow never resolves AND no decision panel is up, boot
            // SOLO rather than hang forever — never silently enter a -client join
            // whose pack sync never finished (when the panel is up, the user drives
            // it, so this stays a no-op then).
            setTimeout(function () {
              if (!gateReleased && !Module.__ysfwJoinFailureShown) bootSolo();
            }, 90000);
            runJoinSync();
          } else if (!freeflight) {
            // Manual launch: show the pack panel; packs-ui.js releases on "play".
            Module.addRunDependency('ysfw-packs');
            Module.__ysfwGateHeld = true;
            // Safety net: if packs-ui.js failed to load, never hang the boot.
            setTimeout(function () {
              if (Module.__ysfwGateHeld && !Module.__ysfwPanelShown) releaseGate();
            }, 5000);
            window.__ysfwFsReady = true;
            if (window.ysfwPacksInit) window.ysfwPacksInit();
          } else {
            // freeflight: boot straight in.  Remember the launched triple so the top
            // page can offer a one-tap "Fly again" next visit (read in packs-ui
            // renderPanel, gated there to bundled presets so it never deep-links into
            // an uninstalled add-on).  Storage may throw (private mode) -> guard.
            try { if (freeflight) localStorage.setItem('ysfwLastFlight', freeflight); } catch (e) {}
            window.__ysfwFsReady = true;
            if (window.ysfwPacksInit) window.ysfwPacksInit();
          }
        } catch (e) {
          releaseGate();
        }
        // Release idbfs-load LAST so the run-dependency count never transiently
        // hits 0 above — otherwise a cached/instant .data preload lets Emscripten
        // schedule run()/callMain before the gate is added, aborting with
        // "cannot call main when async dependencies remain".
        Module.removeRunDependency('idbfs-load');
      });
    }],
    setStatus: function (text) {
      if (booted) return;
      var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
      if (m) {
        bar.style.width = (100 * parseFloat(m[2]) / parseFloat(m[4])) + '%';
        statusEl.textContent = m[1].trim();
      } else {
        statusEl.textContent = text || '';
      }
    },
    onRuntimeInitialized: function () {
      booted = true;
      overlay.classList.add('hidden');
      // Persist /home/web_user/Documents to IndexedDB.  Guard against
      // overlapping syncfs calls (interval + visibilitychange/beforeunload, or a
      // slow write): a second syncfs while one is in flight is wasted work and
      // triggers emscripten's "N FS.syncfs operations in flight" warning.
      var syncing = false;
      var flush = function () {
        if (syncing) return;
        syncing = true;
        try { Module.FS.syncfs(false, function () { syncing = false; }); }
        catch (e) { syncing = false; }
      };
      setInterval(flush, 10000);
      window.addEventListener('visibilitychange', flush);
      window.addEventListener('beforeunload', flush);
    },
    print: function (text) { console.log(text); },
    printErr: (function () {
      // YSFLIGHT's startup shader check prints a benign "Cannot find uniform
      // location ... Could be normal" triplet for uniforms that the GLSL
      // compiler optimized out.  Keep the console readable by default;
      // ?verbose=1 shows everything.
      var verbose = new URLSearchParams(location.search).get('verbose');
      var benign = /^(Called from YsGLSL|Cannot find uniform location|Could be normal since error check|warning: unsupported syscall: __syscall_setsockopt)/;
      return function (text) {
        if (!verbose && benign.test(text)) return;
        console.warn(text);
      };
    })()
  };

  // TURN: fetch short-lived ICE servers (Cloudflare Realtime TURN, minted by the
  // Worker's /turn endpoint) so peers behind symmetric NAT / CGNAT can relay when
  // direct P2P fails — otherwise a cross-machine joiner never receives the host's
  // game state and the aircraft list is empty.  Fired at load so the creds are
  // ready before the user hosts/joins.  The engine game channel reads
  // Module.ysfwIceServers (yssocket) and the pack channel reads window.ysfwPackIce
  // (pack-net.js); both fall back to public STUN if /turn is unconfigured (204) or
  // unreachable.  ?turn=0 forces STUN-only (to reproduce the no-TURN behaviour).
  (function () {
    if (new URLSearchParams(location.search).get('turn') === '0') return;
    try {
      fetch('/turn', { method: 'POST' })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (d && Array.isArray(d.iceServers) && d.iceServers.length) {
            Module.ysfwIceServers = d.iceServers;
            window.ysfwPackIce = d.iceServers;
            console.log('[turn] ICE relay ready (' + d.iceServers.length + ' server group(s))');
          }
        })
        .catch(function () { /* STUN-only fallback */ });
    } catch (e) {}
  })();

  window.addEventListener('error', function (e) {
    if (!booted) statusEl.textContent = 'Error: ' + e.message;
  });

  // PWA: cache the app for instant reload and offline play.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  function loadEngine() {
    var s = document.createElement('script');
    s.async = true;
    s.src = ASSET.js;
    document.body.appendChild(s);
  }

  // ---- On-screen multiplayer UI: connection badge + invite link ------------
  // Three states, driven by globalThis.ysfwInFlight (set by the engine's
  // ChangeRunMode) and globalThis.ysfwRtc.host (set while this browser hosts):

  //   - hosting a server         -> clickable Room ID chip (click = copy invite)
  //   - flying as client / solo  -> nothing
  (function () {

    // control — hover shows a pointer cursor, a 📋 icon hints it is clickable,
    // and clicking copies the invite link /?join=<room>.  It replaces (and
    // hides) the engine's #ysfw-room-overlay.
    var chip = null;
    function ensureChip() {
      if (chip) return chip;

      chip.style.cssText = 'position:fixed;top:8px;right:8px;z-index:31;background:rgba(10,14,20,.85);color:#cfd8e3;padding:8px 14px;border-radius:6px;font:14px monospace;cursor:pointer;user-select:none;display:none';
      chip.title = TXT.chipCopyTitle;

        var R = globalThis.ysfwRtc;

        var url = location.origin + '/?join=' + code;

        };

    }

    // Connection badge: a one-shot STUN probe hinting whether direct P2P is
    // likely.  Same mapped port from two STUN servers => cone NAT (P2P OK);
    // different ports => symmetric NAT (a TURN relay would be needed).
    var badge = null, checkState = 'idle';
    function ensureBadge() {
      if (badge) return badge;
      badge = document.createElement('button');

      badge.style.cssText = 'position:fixed;right:8px;top:8px;z-index:20;font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid #2a3647;background:#0d141d;color:#cfd8e3;cursor:pointer;display:none';

    }
    function setBadge(text, title) {
      var b = ensureBadge();

      if (title) b.title = title;
    }

    function srflxPort(iceServer, timeoutMs) {
      return new Promise(function (resolve) {
        var pc, done = false;
        var finish = function (p) { if (!done) { done = true; try { pc.close(); } catch (e) {} resolve(p); } };
        try { pc = new RTCPeerConnection({ iceServers: [{ urls: iceServer }] }); }
        catch (e) { return resolve(null); }
        try { pc.createDataChannel('probe'); } catch (e) {}
        pc.onicecandidate = function (e) {

    // Is a TURN relay actually available?  The /turn fetch (top of this file)
    // populates Module.ysfwIceServers / window.ysfwPackIce with the Cloudflare
    // iceServers; a turn: URL there means even a symmetric-NAT line can relay.
    function turnAvailable() {
      var ice = (window.Module && window.Module.ysfwIceServers) || window.ysfwPackIce;
      return Array.isArray(ice) && JSON.stringify(ice).indexOf('turn:') !== -1;
    }

      checkState = 'running';
      setBadge(TXT.badgeChecking, TXT.badgeCheckingTitle);
      Promise.all([
        srflxPort('stun:stun.l.google.com:19302'),
        srflxPort('stun:stun1.l.google.com:19302')
      ]).then(function (ports) {
        checkState = 'done';
        if (!ports[0] && !ports[1]) {
          setBadge(TXT.badgeOffline, TXT.badgeOfflineTitle);
        } else if (ports[0] && ports[1] && ports[0] !== ports[1]) {
          // Symmetric NAT: with TURN configured the relay carries it (informational);
          // without TURN it is the old "may not connect to some peers" warning.
          if (turnAvailable()) setBadge(TXT.badgeRelay, TXT.badgeRelayTitle);
          else setBadge(TXT.badgeSymmetric, TXT.badgeSymmetricTitle);
        } else {
          setBadge(TXT.badgeDirect, TXT.badgeDirectTitle);
        }
      });
    }

    setInterval(function () {
      if (!booted) return;
      var roomEl = document.getElementById('ysfw-room-overlay');
      var R = globalThis.ysfwRtc;
      var inFlight = !!globalThis.ysfwInFlight;
      var host = R && R.host;
      if (!inFlight) {

        if (chip) chip.style.display = 'none';
        if (roomEl) roomEl.style.display = 'none';
      } else if (host && !host.failed) {
        // HOSTING: clickable Room ID chip (click to copy invite link); no badge.
        // The chip replaces the engine overlay, so hide #ysfw-room-overlay.
        if (badge) badge.style.display = 'none';
        if (roomEl) roomEl.style.display = 'none';
        renderChip(host.room, !host.ok);
        ensureChip().style.display = 'block';
      } else if (host && host.failed) {
        // Host setup failed: show the engine overlay's specific error message.
        if (badge) badge.style.display = 'none';
        if (chip) chip.style.display = 'none';
        if (roomEl) roomEl.style.display = '';
      } else {
        // FLYING as client/solo: hide everything.
        if (badge) badge.style.display = 'none';
        if (chip) chip.style.display = 'none';
        if (roomEl) roomEl.style.display = 'none';
      }
    }, 800);
  })();

  // ---- Quick Flight: return to the top (pre-boot shell) when the flight ends --
  // Quick Flight deep-links via ?freeflight=..., booting straight into a flight.
  // The engine reports flight state through globalThis.ysfwInFlight (set by its
  // ChangeRunMode).  When the user exits the flight back to the engine menu,
  // ysfwInFlight flips true -> false; we treat that edge as "flight over" and
  // navigate to the clean URL, which IS the pre-boot shell (the top page).  Armed
  // only for ?freeflight launches, so normal in-engine menu navigation after a
  // manual boot is untouched.  We latch on having actually entered flight first,
  // so the initial pre-boot false never counts as an exit.

    var q = new URLSearchParams(location.search);
    if (!q.get('freeflight')) return;  // only Quick Flight deep-links return to top
    var enteredFlight = false;
    setInterval(function () {
      if (!booted) return;
      if (globalThis.ysfwInFlight) { enteredFlight = true; return; }
      if (!enteredFlight) return;  // still booting into the flight; not an exit yet
      var lang = q.get('lang');  // keep an explicit language override across the reload
      location.assign(location.origin + location.pathname + (lang ? '?lang=' + encodeURIComponent(lang) : ''));
    }, 800);
  })();

  // Fullscreen via keyboard only (no on-screen control): F11 and Ctrl+Cmd+F
  // toggle the documentElement in/out of fullscreen.  We fullscreen the
  // documentElement (not just the canvas) so the overlay, Room chip and badge
  // stay visible inside fullscreen.  The listener is on the CAPTURE phase so it
  // beats the engine's SDL key handler; we only swallow these two combos and
  // pass every other key through, so gameplay keys are untouched.  F11 has no
  // default engine action and Ctrl+Cmd+F is not an engine binding, so claiming
  // them here is safe.  Browsers grant fullscreen only from a user gesture — a
  // keydown qualifies; preventDefault on F11 suppresses the browser's own native
  // fullscreen so we don't double-toggle.  Where the Fullscreen API is
  // unavailable (e.g. iOS Safari) the keys simply do nothing.

    // Keyboard Lock (Chromium): YSFLIGHT uses Esc for menus / leaving a flight, but
    // the browser reserves Esc to exit fullscreen.  While fullscreen, lock Esc so it
    // reaches the engine instead; the browser then exits fullscreen only on a LONG
    // Esc press.  No-op where unsupported (Firefox / Safari) -> there Esc still drops
    // fullscreen, an unavoidable browser default.  Lock on enter, release on exit.

    document.addEventListener('webkitfullscreenchange', syncEscLock);

      } catch (e) {}

      // While fullscreen, stop Esc from dropping fullscreen so the engine can use it.
      // Only preventDefault — never stopPropagation — so the engine's own key handler
      // still receives the Esc.  Pairs with the Keyboard Lock above; long-press Esc
      // still exits fullscreen.  (On browsers without Keyboard Lock, preventDefault
      // does not block the fullscreen-exit, so Esc there still leaves fullscreen.)
      if (fsElement() && (e.key === 'Escape' || e.keyCode === 27)) { e.preventDefault(); return; }

    var fsBtn = document.createElement('button');
    fsBtn.id = 'ysfw-fs-btn';
    fsBtn.textContent = TXT.help.fsOpen;
    fsBtn.title = TXT.help.fsTitle;
    fsBtn.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:99999;font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid #2a3647;background:rgba(13,20,29,.85);color:#cfd8e3;cursor:pointer';
    fsBtn.onclick = function () { toggle(); };
    document.body.appendChild(fsBtn);
  })();

  // ---- Controls legend overlay ---------------------------------------------
  // A floating "?" button (always visible) and the "?" key toggle a panel that
  // lists the DEFAULT controls.  Critical for onboarding: with no joystick the
  // engine falls back to MOUSE-as-stick (VerifyAndFixJoystickAxisAssignment in
  // fscontrol.cpp), which is non-obvious.  Pure DOM, engine-agnostic.  The key
  // listener is on the CAPTURE phase so it beats the engine's SDL handler, and it
  // ignores keystrokes typed into form fields (Room ID / name / pack URL).
  (function () {
    var H = TXT.help;
    var panel = null, open = false;
    function build() {
      if (panel) return panel;
      panel = document.createElement('div');
      panel.id = 'ysfw-help';
      panel.style.cssText = 'position:fixed;inset:0;z-index:100000;display:none;align-items:center;justify-content:center;background:rgba(4,8,14,.62)';
      var card = document.createElement('div');

      var intro = document.createElement('div');
      intro.textContent = H.intro;
      intro.style.cssText = 'color:#9db4d0;font-size:12.5px;margin-bottom:12px';
      card.appendChild(intro);
      H.rows.forEach(function (r) {
        var row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #141d28';
        var k = document.createElement('div');
        k.textContent = r[0];
        k.style.cssText = 'flex:0 0 38%;color:#cfe0f5;font:13px/1.4 monospace';
        var a = document.createElement('div');
        a.textContent = r[1];
        a.style.cssText = 'flex:1;color:#9fb2c8;font-size:13px';
        row.appendChild(k); row.appendChild(a); card.appendChild(row);

      var close = document.createElement('button');
      close.textContent = H.close;
      close.style.cssText = 'margin-top:14px;width:100%;padding:9px;border:0;border-radius:8px;background:#1b2735;color:#cfd8e3;font-size:13px;cursor:pointer';
      close.onclick = function () { toggle(false); };
      card.appendChild(close);
      panel.appendChild(card);
      panel.addEventListener('click', function (e) { if (e.target === panel) toggle(false); });

    }
    function toggle(force) {
      open = (typeof force === 'boolean') ? force : !open;
      build().style.display = open ? 'flex' : 'none';
    }
    // Floating "?" button so touch / no-keyboard users can open it too.  Top-left:
    // clear of the top-right badge/chip AND of the bottom corners, which the mobile
    // touch controls (stick / throttle) occupy in flight.
    var btn = document.createElement('button');
    btn.id = 'ysfw-help-btn';
    btn.textContent = H.openHint;
    btn.title = H.toggleTitle;
    btn.style.cssText = 'position:fixed;left:8px;top:8px;z-index:99999;font-size:12px;padding:6px 10px;border-radius:6px;border:1px solid #2a3647;background:rgba(13,20,29,.85);color:#cfd8e3;cursor:pointer';

      var el = document.activeElement;

      if (e.key === '?' && !typing()) { e.preventDefault(); e.stopImmediatePropagation(); toggle(); }
      else if (e.key === 'Escape' && open) { e.preventDefault(); e.stopImmediatePropagation(); toggle(false); }
    }, true);
  })();

  // ---- Mobile touch controls (touch devices, in-flight only) ---------------
  // A minimal on-screen control set so a phone can fly without a keyboard/mouse,
  // WITHOUT an engine rebuild: it drives the engine through synthetic events the
  // port already listens for.
  //   * Left stick pad -> a BUTTONLESS `mousemove` on #canvas.  The engine's
  //     mouse-as-stick (FsPollJoystick in fsplatform_emscripten.cpp reads the
  //     cursor position as aileron/elevator) turns position into pitch/roll;
  //     buttonless means it never fires.  Releasing recenters (mousemove to canvas
  //     center) so the stick returns to neutral -- which the engine's bare
  //     touch=LBUTTONDOWN emulation cannot do.
  //   * Throttle / fire / gear -> synthetic KeyboardEvent on window (Q/A, Space,
  //     KeyG), the exact e.code values FsKeyDownCallback reads.
  // Edges only (the centre/view stays clear), semi-transparent, auto-fades when
  // idle, and only appears in flight on a touch device.
  (function () {
    // Device tier.  PC (fine pointer, no touch) gets no on-screen pad -- it has the
    // keyboard/mouse + the controls legend.  Phone vs tablet are distinguished by the
    // shorter viewport edge: phone is a deliberate TASTER (a small control set + a
    // nudge toward PC/tablet); tablet has room for the fuller rail (added later).

      var c = canvas(); if (!c) return;

    var pad = document.createElement('div');
    pad.id = 'ysfw-stick';

    var knob = document.createElement('div');
    knob.id = 'ysfw-stick-knob';
    knob.style.cssText = 'position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(77,163,255,.55);border:1px solid rgba(77,163,255,.9)';

    }
    // Throttle (hold to repeat Q/A) on the right, above fire/gear.
    // NOTE: the right-bottom corner (right:8,bottom:8) is occupied by the always-on
    // fullscreen button (#ysfw-fs-btn).  Keep every right-side control at bottom>=54
    // so nothing overlaps it.
    var thrUp = mkBtn('▲', 'position:absolute;right:96px;bottom:122px;width:52px;height:48px');
    var thrDn = mkBtn('▼', 'position:absolute;right:96px;bottom:54px;width:52px;height:48px');
    var thrLbl = document.createElement('div');
    thrLbl.textContent = T.thr;
    thrLbl.style.cssText = 'position:absolute;right:96px;bottom:106px;width:52px;text-align:center;color:#8fa3bb;font-size:10px;pointer-events:none';

    // missiles before firing them).
    var fire = mkBtn(T.fire, 'position:absolute;right:14px;bottom:54px;width:72px;height:60px;background:rgba(199,93,106,.35);border-color:rgba(199,93,106,.8)');
    fire.addEventListener('touchstart', function (e) { e.preventDefault(); key('Space', true); wake(); }, { passive: false });
    fire.addEventListener('touchend', function () { key('Space', false); });
    fire.addEventListener('touchcancel', function () { key('Space', false); });
    var wsel = mkBtn(T.wsel, 'position:absolute;right:14px;bottom:122px;width:72px;height:52px');
    wsel.addEventListener('touchstart', function (e) { e.preventDefault(); tap('Digit2'); wake(); }, { passive: false });

    // stick almost the whole time, so only actions done when flight is settled live
    // here -- you briefly lift off the stick to tap them.  View toggles cockpit (F1)
    // <-> outside (F2); gear is used at takeoff/landing.
    var view = mkBtn(T.view, 'position:absolute;left:14px;bottom:156px;width:60px;height:46px');
    var viewFlip = 0;
    view.addEventListener('touchstart', function (e) { e.preventDefault(); tap(viewFlip ? 'F1' : 'F2'); viewFlip = viewFlip ? 0 : 1; wake(); }, { passive: false });
    var gear = mkBtn(T.gear, 'position:absolute;left:84px;bottom:156px;width:60px;height:46px');
    gear.addEventListener('touchstart', function (e) { e.preventDefault(); tap('KeyG'); wake(); }, { passive: false });

    wrap.appendChild(thrLbl); wrap.appendChild(thrUp); wrap.appendChild(thrDn);
    wrap.appendChild(fire); wrap.appendChild(wsel); wrap.appendChild(view); wrap.appendChild(gear);

    // Tablet rail: the bigger screen has room for the fuller control set without
    // covering the (larger) HUD, so add the controls a phone deliberately omits.
    // Left, above view/gear = flaps (R/F, calm).  Right-top (empty in flight) =
    // radar (Digit3) + autopilot-menu (Backspace).  Bottom inboard of the stick
    // and right cluster = a rudder rocker (Z/C, held; taps KeyX to re-center on
    // release, like the stick's auto-center).  The HUD's bottom-centre stays clear.
    if (tier === 'tablet') {
      var flapLbl = document.createElement('div');
      flapLbl.textContent = T.flap;
      flapLbl.style.cssText = 'position:absolute;left:14px;bottom:256px;width:130px;text-align:center;color:#8fa3bb;font-size:10px;pointer-events:none';
      var flapUp = mkBtn('▲', 'position:absolute;left:14px;bottom:210px;width:60px;height:44px');
      flapUp.addEventListener('touchstart', function (e) { e.preventDefault(); tap('KeyR'); wake(); }, { passive: false });
      var flapDn = mkBtn('▼', 'position:absolute;left:84px;bottom:210px;width:60px;height:44px');
      flapDn.addEventListener('touchstart', function (e) { e.preventDefault(); tap('KeyF'); wake(); }, { passive: false });

      var radar = mkBtn(T.radar, 'position:absolute;right:14px;top:48px;width:88px;height:40px;font-size:12px');
      radar.addEventListener('touchstart', function (e) { e.preventDefault(); tap('Digit3'); wake(); }, { passive: false });
      var ap = mkBtn(T.ap, 'position:absolute;right:14px;top:96px;width:88px;height:40px;font-size:12px');
      ap.addEventListener('touchstart', function (e) { e.preventDefault(); tap('Backspace'); wake(); }, { passive: false });

      function rudderBind(btn, code) {
        var iv = null;
        btn.addEventListener('touchstart', function (e) { e.preventDefault(); tap(code); wake(); if (iv) clearInterval(iv); iv = setInterval(function () { tap(code); }, 120); }, { passive: false });
        var stop = function () { if (iv) { clearInterval(iv); iv = null; } tap('KeyX'); }; // re-center
        btn.addEventListener('touchend', stop); btn.addEventListener('touchcancel', stop);
      }
      var rudLbl = document.createElement('div');
      rudLbl.textContent = T.rudder;
      rudLbl.style.cssText = 'position:absolute;left:190px;bottom:62px;width:70px;text-align:center;color:#8fa3bb;font-size:10px;pointer-events:none';
      var rudL = mkBtn('◀', 'position:absolute;left:190px;bottom:14px;width:70px;height:46px');
      var rudR = mkBtn('▶', 'position:absolute;right:190px;bottom:14px;width:70px;height:46px');
      rudderBind(rudL, 'KeyZ'); rudderBind(rudR, 'KeyC');

      wrap.appendChild(flapLbl); wrap.appendChild(flapUp); wrap.appendChild(flapDn);
      wrap.appendChild(radar); wrap.appendChild(ap);
      wrap.appendChild(rudLbl); wrap.appendChild(rudL); wrap.appendChild(rudR);
    }

    // Phone is a taster: the first time flight starts on a phone, nudge toward the
    // full experience on PC/tablet.  Shown once (localStorage), auto-dismisses.
    var nudged = false;
    function maybeNudge() {
      if (nudged || tier !== 'phone') return;
      nudged = true;
      try { if (localStorage.getItem('ysfwTasterNudge')) return; localStorage.setItem('ysfwTasterNudge', '1'); } catch (e) {}
      var n = document.createElement('div');
      n.textContent = T.nudge;
      n.style.cssText = 'position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:100001;max-width:90vw;background:rgba(13,20,29,.92);color:#cfe0f5;border:1px solid #2a3647;border-radius:8px;padding:8px 14px;font-size:12px;text-align:center';
      n.onclick = function () { if (n.parentNode) n.remove(); };
      document.body.appendChild(n);
      setTimeout(function () { if (n.parentNode) n.remove(); }, 7000);
    }

    // Visible only in flight.
    setInterval(function () {
      var show = !!globalThis.ysfwInFlight;
      if (show && wrap.style.display === 'none') { wrap.style.display = 'block'; wake(); maybeNudge(); }
      else if (!show && wrap.style.display !== 'none') { wrap.style.display = 'none'; }
    }, 500);
  })();

  // Host-side pack advertising (M6): once this browser is hosting a game, start
  // the shell-owned pack host on the derived pack-room so joiners can pull the
  // host's enabled packs P2P before they boot.  Keyed on globalThis.ysfwRtc.host
  // (set by the engine while hosting); independent of the engine's game peer
  // connection.  startPackHost publishes the manifest with its room claim.
  (function () {
    var startedRoom = null, handle = null;
    setInterval(function () {
      var R = globalThis.ysfwRtc;
      var room = (R && R.host && !R.host.failed) ? R.host.room : null;
      if (room && startedRoom !== room) {
        try {
          if (handle && handle.stop) handle.stop();
          handle = (window.ysfwPackNet && window.ysfwPackNet.host) ? window.ysfwPackNet.host(room) : null;
          startedRoom = room;
        } catch (e) { console.warn('[pack-net host] start failed: ' + e); }
      } else if (!room && startedRoom) {
        try { if (handle && handle.stop) handle.stop(); } catch (e) {}
        handle = null; startedRoom = null;
      }
    }, 800);
  })();

  // Invite join flow: ?join=<id> asks for a player name (unless ?name= is set),
  // then auto-joins Room <id> over WebRTC as a client.
  (function () {
    var q = new URLSearchParams(location.search);
    var joinRoom = q.get('join');
    var presetName = q.get('name');
    var freeflight = q.get('freeflight');

    function startJoin(name) {
      var nm = (name && name.trim()) || ('Pilot' + Math.floor(1000 + Math.random() * 9000));
      Module.arguments = Module.arguments.concat(['-client', nm, joinRoom]);
      loadEngine();
    }

    // Manual launch: let the user JOIN by typing a Room ID (no invite link).
    // Submitting just navigates to /?join=<room>(&name=<name>), so the whole
    // tested invite-link path runs verbatim — pre-boot pack sync holds the boot
    // gate (preRun reads ysfwJoinRoom from the URL) and the engine boots -client.
    // Reusing that path means no new join/gate logic and no preRun ordering hazard.
    function renderManualJoinForm() {
      if (document.getElementById('ysfw-manual-join')) return;
      var wrap = document.createElement('div');
      wrap.id = 'ysfw-manual-join';
      wrap.style.cssText = 'margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:8px';
      var label = document.createElement('div');
      label.style.cssText = 'font-size:14px;color:#cfd8e3';
      label.textContent = TXT.joinLabel;
      var inputCss = 'font-size:15px;padding:8px 10px;border-radius:6px;border:1px solid #2a3647;background:#0d141d;color:#e6edf3;width:min(260px,70vw);text-align:center';
      var roomIn = document.createElement('input');
      roomIn.type = 'text';
      roomIn.inputMode = 'numeric';
      roomIn.maxLength = 14;
      roomIn.placeholder = 'Room ID';
      roomIn.style.cssText = inputCss;
      var nameIn = document.createElement('input');
      nameIn.type = 'text';
      nameIn.maxLength = 200;
      nameIn.placeholder = TXT.joinNamePlaceholder;
      nameIn.style.cssText = inputCss;
      var err = document.createElement('div');
      err.style.cssText = 'font-size:12px;color:#c75d6a;min-height:1em';
      var btn = document.createElement('button');
      btn.textContent = TXT.joinBtn;
      btn.style.cssText = 'font-size:15px;padding:8px 22px;border-radius:6px;border:0;background:#4da3ff;color:#04101f;cursor:pointer;font-weight:600';
      var go = function () {
        var room = (roomIn.value || '').trim();
        if (!room) { err.textContent = TXT.errRoomEmpty; return; }
        // Keep within the signaling room-key limit (<=16) AND the derived pack
        // room's base budget (base + "~p" <= 16, so base <= 14): see
        // pack-net.js derivePackRoom and worker/signal.js.  Restrict the charset
        // so a pasted invite URL or stray "~" can't desync the derived pack room.
        if (!/^[A-Za-z0-9_-]{1,14}$/.test(room)) { err.textContent = TXT.errRoomInvalid; return; }
        var name = (nameIn.value || '').trim();
        location.href = location.origin + '/?join=' + encodeURIComponent(room) +
          (name ? '&name=' + encodeURIComponent(name) : '');
      };
      btn.addEventListener('click', go);
      roomIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
      nameIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
      // Collapsed by default.  The join form is only useful to someone who already
      // has a Room ID / invite, so on a bare manual launch it should NOT compete for
      // the fold with Quick Flight (the only reliable first-flight route).  A
      // low-emphasis toggle reveals the (byte-for-byte identical) form on demand; the
      // ?join= invite path uses a SEPARATE form (below) and never reaches here.
      var stack = document.createElement('div');
      stack.style.cssText = 'display:none;flex-direction:column;align-items:center;gap:8px';
      stack.appendChild(label);
      stack.appendChild(roomIn);
      stack.appendChild(nameIn);
      stack.appendChild(err);
      stack.appendChild(btn);
      var toggle = document.createElement('button');
      toggle.textContent = TXT.joinToggle;
      toggle.style.cssText = 'background:none;border:0;color:#8fa3bb;font-size:13px;cursor:pointer;padding:4px;text-decoration:underline';
      toggle.addEventListener('click', function () {
        var open = stack.style.display !== 'none';
        stack.style.display = open ? 'none' : 'flex';
        if (!open) setTimeout(function () { roomIn.focus(); }, 30);
      });
      wrap.appendChild(toggle);
      wrap.appendChild(stack);
      overlay.appendChild(wrap);
    }

    // Host how-to: a collapsed "Play with friends" disclosure for the bare manual
    // launch.  Hosting runs through the engine's native Network menu (unchangeable
    // C++), so this only TEACHES the path and points at the existing Room-chip copy
    // control — no new boot logic, no Module.arguments touch.  Self-collapses so it
    // stays fold-safe on its own.
    function renderHostHowto() {
      if (document.getElementById('ysfw-host-howto')) return;
      var H = TXT.host;
      var wrap = document.createElement('div');
      wrap.id = 'ysfw-host-howto';
      wrap.style.cssText = 'margin-top:10px;display:flex;flex-direction:column;align-items:center;gap:8px';
      var card = document.createElement('div');
      card.style.cssText = 'display:none;flex-direction:column;gap:6px;width:min(420px,86vw);background:#0b121b;border:1px solid #1d2633;border-radius:10px;padding:14px 16px;text-align:left;box-sizing:border-box';
      H.steps.forEach(function (s, i) {
        var row = document.createElement('div');
        row.style.cssText = 'color:#9fb2c8;font-size:12.5px;line-height:1.55';
        row.textContent = (i + 1) + '. ' + s;
        card.appendChild(row);
      });
      var toggle = document.createElement('button');
      toggle.textContent = H.toggle;
      toggle.style.cssText = 'background:none;border:0;color:#8fa3bb;font-size:13px;cursor:pointer;padding:4px;text-decoration:underline';
      toggle.addEventListener('click', function () {
        card.style.display = (card.style.display === 'none') ? 'flex' : 'none';
      });
      wrap.appendChild(toggle);
      wrap.appendChild(card);
      overlay.appendChild(wrap);
      // ?host=1 deep-link auto-expands (a deliberate "I want to host" entry).
      try { if (new URLSearchParams(location.search).get('host') === '1') card.style.display = 'flex'; } catch (e) {}
    }

    if (joinRoom && !presetName) {
      statusEl.textContent = '';
      var form = document.createElement('div');
      form.style.cssText = 'margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px';
      var label = document.createElement('div');
      label.style.cssText = 'font-size:14px;color:#cfd8e3';
      label.textContent = TXT.inviteNameLabel(joinRoom);
      var input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 200;
      input.placeholder = 'Pilot';
      input.style.cssText = 'font-size:15px;padding:8px 10px;border-radius:6px;border:1px solid #2a3647;background:#0d141d;color:#e6edf3;width:min(260px,70vw);text-align:center';
      var goBtn = document.createElement('button');
      goBtn.textContent = TXT.inviteJoinBtn;
      goBtn.style.cssText = 'font-size:15px;padding:8px 22px;border-radius:6px;border:0;background:#4da3ff;color:#04101f;cursor:pointer;font-weight:600';
      var go = function () { form.remove(); statusEl.textContent = 'loading...'; startJoin(input.value); };
      goBtn.addEventListener('click', go);
      input.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
      form.appendChild(label); form.appendChild(input); form.appendChild(goBtn);
      overlay.appendChild(form);
      setTimeout(function () { input.focus(); }, 50);
    } else {
      if (joinRoom && presetName) {
        Module.arguments = Module.arguments.concat(['-client', presetName, joinRoom]);
      } else if (!freeflight) {
        // No invite link and not a freeflight deep-link: a deliberate manual
        // launch.  Offer "join by Room ID" next to the pack panel; the engine
        // still loads (for solo / hosting), but submitting the form navigates
        // away to the invite-link join flow before main() matters.
        renderManualJoinForm();
        renderHostHowto();
      }
      loadEngine();
    }
  })();
</script>
</body>
</html>
