name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.0

      - name: Build
        run: scripts/build.sh

      - name: Unit tests (pack engine)
        run: scripts/test.sh

      - name: Install smoke-test browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Smoke test (software GPU)
        run: scripts/smoke-test.sh default

      # Heavier add-on-pack integration smoke (install/toggle/uninstall + the
      # service-worker-cached reload that guards the run-dependency startup
      # race).  Several boot cycles, so PR-only; run locally before push too.
      - name: Pack smoke (PR only)
        if: github.event_name == 'pull_request'
        run: scripts/smoke-pack.sh
