name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.0

      - name: Build
        run: scripts/build.sh

      - name: Unit tests (pack engine)
        run: scripts/test.sh

      # Browser-free signaling-protocol smokes: the host-reconnect / room-reclaim
      # contract (worker/signal.js + its sig-stub mirror) and the pack host's
      # client-side reconnect loop.  Both self-start the sig-stub; fast, no GPU.
      - name: Signaling reconnect smoke (host reclaim + client reconnect)
        run: |
          npm install --no-save ws
          node scripts/smoke-mp-reconnect.mjs
          node scripts/smoke-mp-pack-reconnect.mjs

      - name: Install smoke-test browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Smoke test (software GPU)
        run: scripts/smoke-test.sh default

      # Heavier add-on-pack integration smoke (install/toggle/uninstall + the
      # service-worker-cached reload that guards the run-dependency startup
      # race).  Several boot cycles, so PR-only; run locally before push too.
      - name: Pack smoke (PR only)
        if: github.event_name == 'pull_request'
        run: scripts/smoke-pack.sh

      # Workbench smoke (PR only): assemble an aircraft pack from LOOSE
      # .dat/.dnm/.srf bytes in-page, install it through the normal pipeline,
      # then prove the ENGINE flies it via ?freeflight (the instant-test loop).
      - name: Workbench smoke (PR only)
        if: github.event_name == 'pull_request'
        run: scripts/smoke-workbench.sh

      # (Polygon Crest is dormant — see scripts/build.sh.  Restore its build
      # block and this smoke together: scripts/smoke-modeler.sh)

      # Real 2-browser P2P pack transfer over WebRTC (loopback ICE — no STUN/internet):
      # a host serves from OPFS while a joiner pulls a single pack AND a multi-pack set
      # over the 'ysf-pack' DataChannel, plus a corruption-reject negative.  The only
      # automated guard for the actual byte path + the lazy-pack OPFS-serve fix; PR-only
      # (boots browsers).  Self-starts serve.mjs + sig-stub.mjs and installs ws.
      - name: MP pack transfer smoke (PR only)
        if: github.event_name == 'pull_request'
        run: scripts/smoke-mp-pack.sh

      # MP scenery-pack sync (PR only): a joiner with the pack-sync opt-in
      # (?join&packsync=1) receives the host's scenery pack pre-boot and can fly
      # ON the pack's field -- the dead-client bug when a host picks an add-on
      # field.  Guards the sync path end-to-end for the FIELD category.
      - name: MP scenery-pack sync smoke (PR only)
        if: github.event_name == 'pull_request'
        run: scripts/smoke-mp-scenery.sh

      # Mission deep-link smoke (PR only): boots ?endurance= and asserts the
      # engine reaches in-flight with zero interaction — guards the web-shell
      # entry contract (web/deeplink.js -> -endurance -> EXEMODE_ENDURANCE).
      - name: Mission smoke (PR only)
        if: github.event_name == 'pull_request'
        run: |
          node "${{ github.workspace }}/scripts/serve.mjs" 8924 "${{ github.workspace }}/dist" &
          sleep 2
          node scripts/smoke-mission.mjs "http://localhost:8924/index.html"

      # Create-Flight smoke (PR only): the engine-less Create-Flight page authors
      # a flight spec -> .yfs (yfs.js) -> -flyyfs, and the engine reaches
      # in-flight.  Guards the web Create-Flight path end to end.
      - name: Create-Flight smoke (PR only)
        if: github.event_name == 'pull_request'
        run: |
          node "${{ github.workspace }}/scripts/serve.mjs" 8925 "${{ github.workspace }}/dist" &
          sleep 2
          node scripts/smoke-createflight.mjs "http://localhost:8925/index.html"

      # Settings smoke (PR only): the web Settings page's choices are merged into
      # the engine's flight.cfg at boot (settings.js) and the engine reads them;
      # also checks a non-managed line survives the merge.
      - name: Settings smoke (PR only)
        if: github.event_name == 'pull_request'
        run: |
          node "${{ github.workspace }}/scripts/serve.mjs" 8926 "${{ github.workspace }}/dist" &
          sleep 2
          node scripts/smoke-settings.mjs "http://localhost:8926/index.html"

      # Metrics smoke (PR only): a flight in a real browser produces the
      # flight-start / flight-end data points that docs/metrics.md's SQL counts,
      # and ?metrics=off posts nothing at all.  This is the guard against the
      # failure mode that matters for a counter -- it stops counting and nothing
      # looks wrong, because zero players and a broken pipeline read the same.
      # No engine boot (the flight flag is flipped directly), so it is cheap.
      - name: Metrics smoke (PR only)
        if: github.event_name == 'pull_request'
        run: |
          node "${{ github.workspace }}/scripts/serve.mjs" 8931 "${{ github.workspace }}/dist" &
          sleep 2
          node scripts/smoke-metrics.mjs "http://localhost:8931/index.html"

      # Host smoke (PR only): boots ?host=1&name= and asserts the engine reaches
      # multiplayer server mode and claims the signaling room against a local
      # sig-stub — guards the web host entry (web/deeplink.js -> -server ->
      # EXEMODE_SERVER -> yssocket host).
      - name: Host smoke (PR only)
        if: github.event_name == 'pull_request'
        run: scripts/smoke-host.sh

      # Controls smoke (PR only): the web Controller Setup page's gamepad
      # preset + dead zone reach the engine's ctlassign.cfg with the full
      # default keyboard map preserved (a partial file would wipe it).
      - name: Controls smoke (PR only)
        if: github.event_name == 'pull_request'
        run: |
          node "${{ github.workspace }}/scripts/serve.mjs" 8929 "${{ github.workspace }}/dist" &
          sleep 2
          node scripts/smoke-controls.mjs "http://localhost:8929/index.html"

      # VR menu smoke (PR only): verifies that the engine renders the 2D main
      # menu into the VR off-screen FBO (setupMenu/DrawMenu/updateMenuLayer),
      # that the menuDrawn flag is set, and that the watchdog stays disarmed.
      # Requires the native-GL ANGLE path (--use-angle=gl) for OVR_multiview2;
      # headless-only, no physical headset needed.
      - name: VR menu smoke (PR only)
        if: github.event_name == 'pull_request'
        run: |
          node "${{ github.workspace }}/scripts/serve.mjs" 8923 "${{ github.workspace }}/dist" &
          sleep 2
          node scripts/smoke-vrmenu.mjs "http://localhost:8923/index.html" "."

      # The vrmenu smoke screenshots (menu / VR / timeout-diagnostic) are the
      # fastest way to see what the headless page actually showed when the
      # smoke fails -- upload them only in that case.
      - name: Upload VR menu smoke screenshots (on failure)
        if: github.event_name == 'pull_request' && failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrmenu-smoke-screenshots
          path: vrmenu-*.png
          if-no-files-found: ignore
